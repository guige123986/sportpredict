<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-card: #1c2128;
  --bg-card-hover: #22272e;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --border: #30363d;
  --accent-football: #2ea043;
  --accent-basketball: #f0883e;
  --accent-esports: #a855f7;
  --accent-tennis: #a3e635;
  --accent-baseball: #3b82f6;
  --accent-football-nfl: #ef4444;
  --accent-hockey: #06b6d4;
  --accent-rugby: #10b981;
  --accent-cricket: #f59e0b;
  --accent-fighting: #dc2626;
  --accent-current: var(--accent-football);
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: var(--accent-current); text-decoration:none; }

/* Layout */
.app-layout { display:flex; flex:1; min-height:0; }

/* Sidebar */
.sidebar {
  width: 220px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
.sidebar-logo {
  padding: 20px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-logo span { font-size:22px; }
.sidebar-nav { padding: 12px 0; flex:1; }
.nav-group-label {
  padding: 8px 20px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all .2s;
  font-size: 14px;
  border-left: 3px solid transparent;
}
.nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
.nav-item.active {
  background: var(--bg-card);
  color: var(--text-primary);
  border-left-color: var(--accent-current);
  font-weight: 600;
}
.nav-item .emoji { font-size:20px; width:28px; text-align:center; }
.nav-item .nav-label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-item .nav-count { font-size:11px; color:var(--text-muted); background:var(--bg-primary); padding:1px 6px; border-radius:8px; }
.sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
}

/* Main Content */
.main-content { flex:1; display:flex; flex-direction:column; min-width:0; }
.top-bar {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-secondary);
}
.top-bar h1 { font-size:20px; font-weight:700; }
.top-bar-right { display:flex; align-items:center; gap:12px; font-size:13px; color:var(--text-secondary); }
.api-badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:12px;
  font-size:12px; font-weight:600;
  background:rgba(46,160,67,.12); color:#2ea043;
}
.api-badge.warning { background:rgba(240,136,62,.12); color:#f0883e; }
.api-badge.danger { background:rgba(239,68,68,.12); color:#ef4444; }
.refresh-btn {
  display:inline-flex; align-items:center; gap:4px;
  padding:5px 12px; border-radius:8px;
  border:1px solid var(--border); background:transparent;
  color:var(--text-secondary); font-size:12px;
  cursor:pointer; transition:all .2s;
}
.refresh-btn:hover { border-color:var(--accent-current); color:var(--text-primary); }
.refresh-btn.spinning .refresh-icon { animation: spin 1s linear infinite; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.page-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); background:var(--bg-secondary); }
.page-tab {
  padding: 12px 24px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  transition: all .2s;
}
.page-tab:hover { color:var(--text-primary); }
.page-tab.active { color:var(--accent-current); border-bottom-color:var(--accent-current); font-weight:600; }

.content-area { flex:1; overflow-y:auto; padding:20px 24px; }

/* Loading */
.loading-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:60px 20px; color:var(--text-muted); gap:12px;
}
.loading-spinner {
  width:36px; height:36px; border:3px solid var(--border);
  border-top-color:var(--accent-current); border-radius:50%;
  animation: spin .8s linear infinite;
}
.error-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:60px 20px; color:var(--text-muted); gap:12px; text-align:center;
}
.error-state .error-icon { font-size:48px; }
.error-state .error-msg { font-size:14px; color:var(--text-secondary); max-width:400px; }
.error-state .retry-btn {
  margin-top:8px; padding:8px 20px; border-radius:8px;
  border:1px solid var(--accent-current); background:transparent;
  color:var(--accent-current); font-size:13px; cursor:pointer;
  transition:all .2s;
}
.error-state .retry-btn:hover { background:var(--accent-current); color:#fff; }

/* Sub-filter */
.sub-filter {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.sub-filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.sub-filter-btn:hover { border-color:var(--accent-current); color:var(--text-primary); }
.sub-filter-btn.active {
  background: var(--accent-current);
  color: #fff;
  border-color: var(--accent-current);
}

/* Match Card */
.match-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
  transition: all .2s;
}
.match-card:hover { background:var(--bg-card-hover); border-color:var(--accent-current); }
.match-card.arb-highlight { border-color:#2ea043; box-shadow:0 0 12px rgba(46,160,67,.2); }
.match-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--text-muted);
}
.match-league {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,255,255,.06);
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
}
.match-time { color:var(--text-secondary); }
.match-body { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.team {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:6px;
}
.team-name { font-size:15px; font-weight:600; }
.team-logo { font-size:28px; }
.predict-bar-wrap { flex:2; max-width:360px; }
.predict-bar {
  height: 28px;
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  background: var(--bg-primary);
  position: relative;
}
.predict-bar .fill {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  transition: width .6s ease;
  min-width: 28px;
}
.fill-home { background: var(--accent-current); border-radius:14px 0 0 14px; }
.fill-draw { background: #6e7681; }
.fill-away { background: #3b434d; border-radius:0 14px 14px 0; }
.predict-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-muted);
}
.confidence {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.confidence-label { color:var(--text-muted); }
.confidence-value { font-weight:700; }
.confidence-value.high { color:#2ea043; }
.confidence-value.medium { color:#f0883e; }
.confidence-value.low { color:#ef4444; }

/* Arb badge */
.arb-badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:12px;
  font-size:12px; font-weight:700;
  background:rgba(46,160,67,.15); color:#2ea043;
  margin-left:8px;
}

/* Match card footer row */
.match-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

/* Watch Live Button */
.watch-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.04);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all .2s;
}
.watch-btn:hover {
  background: var(--accent-current);
  color: #fff;
  border-color: var(--accent-current);
}

/* Odds comparison table */
.odds-toggle {
  display:inline-flex; align-items:center; gap:4px;
  padding:4px 10px; border-radius:6px;
  border:1px solid var(--border); background:transparent;
  color:var(--text-secondary); font-size:11px;
  cursor:pointer; transition:all .2s; margin-left:8px;
}
.odds-toggle:hover { border-color:var(--accent-current); color:var(--text-primary); }
.odds-table-wrap {
  margin-top:12px; overflow-x:auto;
  max-height:0; overflow:hidden; transition:max-height .3s ease;
}
.odds-table-wrap.open { max-height:800px; overflow-y:auto; }
.odds-table {
  width:100%; border-collapse:collapse; font-size:12px;
}
.odds-table th {
  padding:8px 10px; text-align:left; color:var(--text-muted);
  border-bottom:1px solid var(--border); font-weight:600;
  position:sticky; top:0; background:var(--bg-card);
}
.odds-table td {
  padding:6px 10px; border-bottom:1px solid var(--border);
  color:var(--text-secondary);
}
.odds-table tr:hover td { background:var(--bg-card-hover); }
.odds-table .best-odd { color:#2ea043; font-weight:700; }

/* Combo Section */
.combo-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
}
.combo-header {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:12px;
}
.combo-type {
  font-weight:700;
  font-size:14px;
  padding:4px 10px;
  border-radius:6px;
}
.combo-type.s2 { background:rgba(46,160,67,.15); color:var(--accent-football); }
.combo-type.s3 { background:rgba(168,85,247,.15); color:var(--accent-esports); }
.combo-type.cross { background:rgba(240,136,62,.15); color:var(--accent-basketball); }
.combo-risk { font-size:12px; }
.combo-risk.low { color:#2ea043; }
.combo-risk.medium { color:#f0883e; }
.combo-risk.high { color:#ef4444; }
.combo-picks { display:flex; flex-direction:column; gap:8px; }
.combo-pick {
  display:flex; align-items:center; gap:12px;
  padding:8px 12px;
  background:var(--bg-primary);
  border-radius:8px;
  font-size:13px;
}
.combo-pick .sport-emoji { font-size:18px; }
.combo-pick .pick-info { flex:1; }
.combo-pick .pick-team { font-weight:600; }
.combo-pick .pick-opp { color:var(--text-secondary); }
.combo-pick .pick-pct {
  font-weight:700; font-size:14px;
}
.combo-footer {
  margin-top:12px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:13px; color:var(--text-secondary);
}
.combo-total { font-weight:700; color:var(--text-primary); }

/* Dashboard */
.dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
.dash-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
}
.dash-card h3 { font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.hit-rate-row {
  display:flex; align-items:center; gap:12px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}
.hit-rate-row:last-child { border:none; }
.hit-rate-row .emoji { font-size:18px; width:24px; text-align:center; }
.hit-rate-row .sport-name { flex:1; }
.hit-rate-bar-bg {
  width:100px; height:8px; background:var(--bg-primary);
  border-radius:4px; overflow:hidden;
}
.hit-rate-bar { height:100%; border-radius:4px; transition:width .6s; }
.hit-rate-pct { font-weight:700; width:48px; text-align:right; }
.hot-item {
  display:flex; align-items:center; gap:10px;
  padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;
}
.hot-item:last-child { border:none; }
.hot-rank {
  width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:#fff;
  background:#3b434d;
}
.hot-rank.r1 { background:#f0883e; }
.hot-rank.r2 { background:#8b949e; }
.hot-rank.r3 { background:#a0522d; }
.streak-item {
  display:flex; align-items:center; gap:10px;
  padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;
}
.streak-item:last-child { border:none; }
.streak-count { font-weight:700; font-size:16px; }

/* Disclaimer */
.disclaimer {
  padding:20px 24px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--text-muted);
  text-align:center;
  line-height:1.8;
}

/* ===== Language Switcher ===== */
.lang-switcher {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.lang-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.lang-btn:hover { border-color: var(--accent-current); color: var(--text-primary); }
.lang-btn .lang-globe { font-size: 16px; }
.lang-dropdown {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 4px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
  min-width: 160px;
  z-index: 1000;
  display: none;
  overflow: hidden;
}
.lang-dropdown.open { display: block; }
.lang-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: all .15s;
}
.lang-option:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.lang-option.active { color: var(--accent-current); font-weight: 600; }
.lang-option .lang-flag { font-size: 18px; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 90%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 12px 48px rgba(0,0,0,.5);
  transform: translateY(20px);
  transition: transform .25s;
}
.modal-overlay.open .modal-box { transform: translateY(0); }
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.modal-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.modal-close:hover { background: var(--bg-primary); color: var(--text-primary); }
.modal-body { padding: 20px; }
.channel-list { display: flex; flex-direction: column; gap: 10px; }
.channel-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg-primary);
  border-radius: 8px;
  transition: all .2s;
}
.channel-item:hover { background: var(--bg-card-hover); }
.channel-icon { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
.channel-info { flex: 1; }
.channel-name { font-size: 14px; font-weight: 600; }
.channel-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.channel-link {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 6px;
  background: var(--accent-current);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  transition: opacity .2s;
  flex-shrink: 0;
}
.channel-link:hover { opacity: .85; }
.modal-disclaimer {
  margin-top: 16px;
  padding: 12px;
  background: rgba(240,136,62,.08);
  border: 1px solid rgba(240,136,62,.2);

async function fetchSports() {
  const cacheKey = 'odds_api_sports';
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    try {
      const parsed = JSON.parse(cached);
      if (Date.now() - parsed.ts < CACHE_TTL) {
        sportsList = parsed.data;
        return sportsList;
      }
    } catch(e) {}
  }
  try {
    const resp = await fetch(`${API_BASE}/sports/?apiKey=${API_KEY}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const remaining = resp.headers.get('X-Requests-Remaining');
    if (remaining) apiRequestsRemaining = parseInt(remaining);
    const data = await resp.json();
    sportsList = data.filter(s => s.active);
    localStorage.setItem(cacheKey, JSON.stringify({ data: sportsList, ts: Date.now() }));
    return sportsList;
  } catch(e) {
    // Try stale cache
    if (cached) {
      try { sportsList = JSON.parse(cached).data; return sportsList; } catch(e2) {}
    }
    throw e;
  }
}

async function fetchOdds(sportKey, forceRefresh = false) {
  if (!forceRefresh && oddsCache[sportKey] && Date.now() - oddsCache[sportKey].ts < CACHE_TTL) {
    return oddsCache[sportKey].data;
  }
  // Also check localStorage
  if (!forceRefresh) {
    const cacheKey = `odds_api_odds_${sportKey}`;
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      try {
        const parsed = JSON.parse(cached);
        if (Date.now() - parsed.ts < CACHE_TTL) {
          oddsCache[sportKey] = parsed;
          return parsed.data;
        }
      } catch(e) {}
    }
  }

  isLoadingOdds = true;
  renderContent();

  try {
    const resp = await fetch(`${API_BASE}/sports/${sportKey}/odds/?apiKey=${API_KEY}&regions=eu,us&markets=h2h`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const remaining = resp.headers.get('X-Requests-Remaining');
    if (remaining) apiRequestsRemaining = parseInt(remaining);
    updateApiBadge();
    const data = await resp.json();
    const cacheObj = { data, ts: Date.now() };
    oddsCache[sportKey] = cacheObj;
    localStorage.setItem(`odds_api_odds_${sportKey}`, JSON.stringify(cacheObj));
    return data;
  } catch(e) {
    // Try stale cache on error
    const cacheKey = `odds_api_odds_${sportKey}`;
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      try {
        const parsed = JSON.parse(cached);
        oddsCache[sportKey] = parsed;
        return parsed.data;
      } catch(e2) {}
    }
    throw e;
  } finally {
    isLoadingOdds = false;
  }
}

// ===== ODDS CALCULATION =====
function calcImpliedProbabilities(match) {
  if (!match.bookmakers || !match.bookmakers.length) return null;

  let bestHome = 0, bestDraw = 0, bestAway = 0;
  let allOdds = []; // for odds comparison table

  match.bookmakers.forEach(bk => {
    const h2h = bk.markets?.find(m => m.key === 'h2h');
    if (!h2h) return;
    const outcomes = h2h.outcomes;
    const homeOdds = outcomes.find(o => o.name === match.home_team)?.price || 0;
    const awayOdds = outcomes.find(o => o.name === match.away_team)?.price || 0;
    const drawOdds = outcomes.find(o => o.name === 'Draw')?.price || 0;

    allOdds.push({ bookmaker: bk.title, homeOdds, awayOdds, drawOdds });

    if (homeOdds > bestHome) bestHome = homeOdds;
    if (awayOdds > bestAway) bestAway = awayOdds;
    if (drawOdds > bestDraw) bestDraw = drawOdds;
  });

  if (!bestHome || !bestAway) return null;

  const hasDraw = bestDraw > 0;
  let totalImplied;
  if (hasDraw) {
    totalImplied = 1/bestHome + 1/bestDraw + 1/bestAway;
  } else {
    totalImplied = 1/bestHome + 1/bestAway;
  }

  const homeProb = Math.round((1/bestHome / totalImplied) * 100);
  const awayProb = Math.round((1/bestAway / totalImplied) * 100);
  const drawProb = hasDraw ? 100 - homeProb - awayProb : 0;

  // Arbitrage detection
  const arbSum = totalImplied;
  const isArb = arbSum < 1;
  const arbProfit = isArb ? Math.round((1 - arbSum) * 100 * 100) / 100 : 0;

  // Confidence based on market consensus (lower margin = higher confidence)
  const margin = totalImplied - 1;
  const confidence = Math.max(50, Math.min(95, Math.round((1 - margin) * 100)));

  return {
    homeProb, awayProb, drawProb, hasDraw,
    bestHome, bestAway, bestDraw,
    isArb, arbProfit,
    confidence,
    allOdds,
  };
}

function buildSidebar() {

  if (!sportsList.length) {

  // Group sports by group

    groups[s.group].push(s);
  });

  let html = '';
  // First: "All" item for each group category
  const groupOrder = Object.keys(groups).sort((a, b) => {
    const order = ['Soccer','Basketball','Baseball','Ice Hockey','Tennis','American Football','Boxing','MMA','Esports','Cricket','Rugby'];
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;

  groupOrder.forEach(group => {
    const info = getGroupInfo(group);

function renderMatches() {
  const matches = getCurrentOdds();
  const info = getCurrentSportInfo();
  if (!info) return '';

  const { sport, groupInfo } = info;

  // Build sub-filter: list unique sport_titles (leagues)
  const leagues = [...new Set(matches.map(m => m.sport_title))];
  const allLabel = t('all');

  let html = `<div class="sub-filter">`;
  html += `<button class="sub-filter-btn${!currentSubFilter ? ' active' : ''}" onclick="filterSub(null)">${allLabel}</button>`;
  leagues.forEach(l => {
    const isActive = currentSubFilter === l;
    html += `<button class="sub-filter-btn${isActive ? ' active' : ''}" onclick="filterSub('${l.replace(/'/g, "\\'")}')">${l}</button>`;
  });
  html += `</div>`;

  const filtered = currentSubFilter ? matches.filter(m => m.sport_title === currentSubFilter) : matches;

  if (!filtered.length) {
    html += `<div style="text-align:center;padding:60px 0;color:var(--text-muted);font-size:15px;">${t('noMatches', {sport: sport.title})}</div>`;
    return html;
  }

  filtered.forEach((m, idx) => {
    const prob = calcImpliedProbabilities(m);
    if (!prob) return; // skip matches without odds

    const timeStr = formatTime(m.commence_time);
    const hasDraw = prob.hasDraw;
    const confClass = prob.confidence >= 80 ? 'high' : prob.confidence >= 65 ? 'medium' : 'low';

    html += `<div class="match-card${prob.isArb ? ' arb-highlight' : ''}">
      <div class="match-header">
        <span class="match-league">${groupInfo.emoji} ${m.sport_title}</span>

      </div>

        </div>

          <div class="predict-bar">
            <div class="fill fill-home" style="width:${prob.homeProb}%">${prob.homeProb}%</div>
            ${hasDraw ? `<div class="fill fill-draw" style="width:${prob.drawProb}%">${prob.drawProb}%</div>` : ''}
            <div class="fill fill-away" style="width:${prob.awayProb}%">${prob.awayProb}%</div>
          </div>
          <div class="predict-labels">
            <span>${t('homeTeam')} ${prob.bestHome.toFixed(2)}</span>
            ${hasDraw ? `<span>${t('draw')} ${prob.bestDraw.toFixed(2)}</span>` : ''}
            <span>${t('awayTeam')} ${prob.bestAway.toFixed(2)}</span>
          </div>
        </div>
        <div class="team">
          <span class="team-name">${m.away_team}</span>
        </div>
      </div>
      <div class="match-card-footer">
        <div class="confidence">
          <span class="confidence-label">${t('confidence')}</span>
          <span class="confidence-value ${confClass}">${prob.confidence}%</span>
          ${prob.isArb ? `<span class="arb-badge">🌟 ${t('arbOpportunity')} ${prob.arbProfit}%</span>` : ''}
        </div>
        <div>
          <button class="odds-toggle" onclick="toggleOddsTable('odds_${idx}')">${t('showOdds')}</button>
          <button class="watch-btn" onclick="openWatchModal('${sport.group}')">${t('watchLive')}</button>
        </div>
      </div>
      <div class="odds-table-wrap" id="odds_${idx}">
        ${renderOddsTable(m, prob)}
      </div>
    </div>`;
  });

  return html;
}

function renderOddsTable(match, prob) {
  if (!prob.allOdds || !prob.allOdds.length) return '';

  // Find best odds per outcome
  let maxHome = 0, maxAway = 0, maxDraw = 0;
  prob.allOdds.forEach(o => {
    if (o.homeOdds > maxHome) maxHome = o.homeOdds;
    if (o.awayOdds > maxAway) maxAway = o.awayOdds;
    if (o.drawOdds > maxDraw) maxDraw = o.drawOdds;
  });
  const hasDraw = maxDraw > 0;

  let html = `<table class="odds-table">
    <thead><tr>
      <th>${t('bookmaker')}</th>
      <th>${match.home_team}</th>
      ${hasDraw ? '<th>Draw</th>' : ''}
      <th>${match.away_team}</th>
    </tr></thead><tbody>`;

  prob.allOdds.forEach(o => {
    html += `<tr>
      <td>${o.bookmaker}</td>
      <td class="${o.homeOdds === maxHome ? 'best-odd' : ''}">${o.homeOdds.toFixed(2)}</td>
      ${hasDraw ? `<td class="${o.drawOdds === maxDraw ? 'best-odd' : ''}">${o.drawOdds.toFixed(2)}</td>` : ''}
      <td class="${o.awayOdds === maxAway ? 'best-odd' : ''}">${o.awayOdds.toFixed(2)}</td>
    </tr>`;
  });

  html += `</tbody></table>`;
  html += `<div style="margin-top:8px;font-size:11px;color:var(--text-muted);display:flex;gap:16px;flex-wrap:wrap;">
    <span>${t('bestOdds')}: <strong style="color:#2ea043">${match.home_team} ${maxHome.toFixed(2)}</strong></span>
    ${hasDraw ? `<span>Draw <strong style="color:#2ea043">${maxDraw.toFixed(2)}</strong></span>` : ''}
    <span>${match.away_team} <strong style="color:#2ea043">${maxAway.toFixed(2)}</strong></span>
  </div>`;

  return html;
}

function toggleOddsTable(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('open');
  // Update toggle button text
  const btn = el.parentElement.querySelector('.odds-toggle');
  if (btn) btn.textContent = el.classList.contains('open') ? t('hideOdds') : t('showOdds');
}

function filterSub(league) {
  currentSubFilter = league;
  renderContent();
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  const localeMap = { zh:'zh-CN', en:'en-US', es:'es-ES', pt:'pt-BR', ar:'ar-SA', ja:'ja-JP', ko:'ko-KR', ru:'ru-RU', fr:'fr-FR', de:'de-DE' };
  return d.toLocaleDateString(localeMap[currentLang] || 'en-US', { month:'2-digit', day:'2-digit' }) + ' ' +
         d.toLocaleTimeString(localeMap[currentLang] || 'en-US', { hour:'2-digit', minute:'2-digit', hour12:false });
}

// ===== COMBOS =====
function renderCombos() {
  const matches = getCurrentOdds();
  const info = getCurrentSportInfo();
  if (!info) return '';

  const { sport, groupInfo } = info;
  const sportName = sport.title;
  let html = '';

  // Calculate probabilities for all matches
  const matchProbs = matches.map(m => ({ match: m, prob: calcImpliedProbabilities(m) })).filter(mp => mp.prob);

  // Same-sport 2串1
  if (matchProbs.length >= 2) {
    html += `<h3 style="margin-bottom:12px;font-size:16px;">${groupInfo.emoji} ${t('combo2', {sport: sportName})}</h3>`;
    for (let i = 0; i < matchProbs.length - 1; i += 2) {
      const mp1 = matchProbs[i], mp2 = matchProbs[i+1];
      const pick1 = mp1.prob.homeProb >= mp1.prob.awayProb ? 'home' : 'away';
      const pick2 = mp2.prob.homeProb >= mp2.prob.awayProb ? 'home' : 'away';
      const pct1 = pick1 === 'home' ? mp1.prob.homeProb : mp1.prob.awayProb;
      const pct2 = pick2 === 'home' ? mp2.prob.homeProb : mp2.prob.awayProb;
      const comboPct = Math.round(pct1 * pct2 / 100);
      const riskClass = comboPct >= 40 ? 'low' : comboPct >= 30 ? 'medium' : 'high';
      const riskLabel = riskClass === 'low' ? t('lowRisk') : riskClass === 'medium' ? t('mediumRisk') : t('highRisk');
      html += `<div class="combo-card">
        <div class="combo-header">
          <span class="combo-type s2">${t('combo2Label')}</span>
          <span class="combo-risk ${riskClass}">${riskLabel} · ${t('comboWinRate')} ${comboPct}%</span>
        </div>
        <div class="combo-picks">
          <div class="combo-pick">
            <span class="sport-emoji">${groupInfo.emoji}</span>
            <span class="pick-info"><span class="pick-team">${pick1 === 'home' ? mp1.match.home_team : mp1.match.away_team}</span> <span class="pick-opp">${t('vs')} ${pick1 === 'home' ? mp1.match.away_team : mp1.match.home_team}</span></span>
            <span class="pick-pct" style="color:var(--accent-current)">${pct1}%</span>
          </div>
          <div class="combo-pick">
            <span class="sport-emoji">${groupInfo.emoji}</span>
            <span class="pick-info"><span class="pick-team">${pick2 === 'home' ? mp2.match.home_team : mp2.match.away_team}</span> <span class="pick-opp">${t('vs')} ${pick2 === 'home' ? mp2.match.away_team : mp2.match.home_team}</span></span>
            <span class="pick-pct" style="color:var(--accent-current)">${pct2}%</span>
          </div>
        </div>
        <div class="combo-footer">
          <span>${t('comboWinRate')}</span>
          <span class="combo-total">${comboPct}%</span>
        </div>
      </div>`;
    }
  }

  // 3串1
  if (matchProbs.length >= 3) {
    html += `<h3 style="margin:20px 0 12px;font-size:16px;">${groupInfo.emoji} ${t('combo3', {sport: sportName})}</h3>`;
    const mp1 = matchProbs[0], mp2 = matchProbs[1], mp3 = matchProbs[2];
    const picks = [mp1, mp2, mp3].map(mp => {
      const pick = mp.prob.homeProb >= mp.prob.awayProb ? 'home' : 'away';
      return { team: pick === 'home' ? mp.match.home_team : mp.match.away_team, opp: pick === 'home' ? mp.match.away_team : mp.match.home_team, pct: pick === 'home' ? mp.prob.homeProb : mp.prob.awayProb };
    });
    const comboPct = Math.round(picks[0].pct * picks[1].pct * picks[2].pct / 10000);
    const riskClass = comboPct >= 30 ? 'low' : comboPct >= 20 ? 'medium' : 'high';
    const riskLabel = riskClass === 'low' ? t('lowRisk') : riskClass === 'medium' ? t('mediumRisk') : t('highRisk');
    html += `<div class="combo-card">
      <div class="combo-header">
        <span class="combo-type s3">${t('combo3Label')}</span>
        <span class="combo-risk ${riskClass}">${riskLabel} · ${t('comboWinRate')} ${comboPct}%</span>
      </div>
      <div class="combo-picks">
        ${picks.map(p => `<div class="combo-pick">
          <span class="sport-emoji">${groupInfo.emoji}</span>
          <span class="pick-info"><span class="pick-team">${p.team}</span> <span class="pick-opp">${t('vs')} ${p.opp}</span></span>
          <span class="pick-pct" style="color:var(--accent-current)">${p.pct}%</span>
        </div>`).join('')}
      </div>
      <div class="combo-footer">
        <span>${t('comboWinRate')}</span>
        <span class="combo-total">${comboPct}%</span>
      </div>
    </div>`;
  }

  // Cross-sport combos from cached data
  html += `<h3 style="margin:20px 0 12px;font-size:16px;">🌍 ${t('crossCombo')}</h3>`;
  const crossSportMatches = [];
  Object.keys(oddsCache).forEach(sk => {
    const data = oddsCache[sk].data;
    data.forEach(m => {
      const prob = calcImpliedProbabilities(m);
      if (prob) crossSportMatches.push({ match: m, prob, sportKey: sk });
    });
  });

  if (crossSportMatches.length >= 3) {
    // Pick top 3 highest confidence from different sports
    const bySport = {};
    crossSportMatches.forEach(cm => {
      if (!bySport[cm.sportKey] || cm.prob.confidence > bySport[cm.sportKey].prob.confidence) {
        bySport[cm.sportKey] = cm;
      }
    });
    const topCross = Object.values(bySport).sort((a,b) => b.prob.confidence - a.prob.confidence).slice(0, 3);

    if (topCross.length >= 3) {
      const comboPct = Math.round(topCross.reduce((acc, cm) => {
        const pick = cm.prob.homeProb >= cm.prob.awayProb ? 'home' : 'away';
        return acc * (pick === 'home' ? cm.prob.homeProb : cm.prob.awayProb);
      }, 100) / 10000);
      const riskClass = comboPct >= 30 ? 'low' : comboPct >= 20 ? 'medium' : 'high';
      const riskLabel = riskClass === 'low' ? t('lowRisk') : riskClass === 'medium' ? t('mediumRisk') : t('highRisk');

      html += `<div class="combo-card">
        <div class="combo-header">
          <span class="combo-type cross">${t('crossCombo3')}</span>
          <span class="combo-risk ${riskClass}">${riskLabel} · ${t('comboWinRate')} ${comboPct}%</span>
        </div>
        <div class="combo-picks">
          ${topCross.map(cm => {
            const sInfo = sportsList.find(s => s.key === cm.sportKey);
            const gInfo = sInfo ? getGroupInfo(sInfo.group) : DEFAULT_GROUP;
            const pick = cm.prob.homeProb >= cm.prob.awayProb ? 'home' : 'away';
            const team = pick === 'home' ? cm.match.home_team : cm.match.away_team;
            const opp = pick === 'home' ? cm.match.away_team : cm.match.home_team;
            const pct = pick === 'home' ? cm.prob.homeProb : cm.prob.awayProb;
            return `<div class="combo-pick">
              <span class="sport-emoji">${gInfo.emoji}</span>
              <span class="pick-info"><span class="pick-team">${team}</span> <span class="pick-opp">${t('vs')} ${opp}</span></span>
              <span class="pick-pct" style="color:var(--accent-current)">${pct}%</span>
            </div>`;
          }).join('')}
        </div>
        <div class="combo-footer">
          <span>${t('comboWinRate')}</span>
          <span class="combo-total">${comboPct}%</span>
        </div>
      </div>`;
    }
  } else {
    html += `<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px;">${t('noData')}</div>`;
  }

  return html;
}

// ===== DASHBOARD =====
function renderDashboard() {
  let html = '<div class="dashboard-grid">';

  // Implied win rate distribution by group
  html += `<div class="dash-card"><h3>${t('dashHitRate')}</h3>`;
  const groupStats = {};
  Object.keys(oddsCache).forEach(sk => {
    const sInfo = sportsList.find(s => s.key === sk);
    if (!sInfo) return;
    const group = sInfo.group;
    if (!groupStats[group]) groupStats[group] = { totalProb: 0, count: 0 };
    oddsCache[sk].data.forEach(m => {
      const prob = calcImpliedProbabilities(m);
      if (prob) {
        const maxProb = Math.max(prob.homeProb, prob.awayProb);
        groupStats[group].totalProb += maxProb;
        groupStats[group].count++;
      }
    });
  });

  Object.entries(groupStats).sort((a,b) => {
    const avgA = a[1].count ? a[1].totalProb / a[1].count : 0;
    const avgB = b[1].count ? b[1].totalProb / b[1].count : 0;
    return avgB - avgA;
  }).forEach(([group, stats]) => {
    const info = getGroupInfo(group);
    const avg = stats.count ? Math.round(stats.totalProb / stats.count) : 0;
    html += `<div class="hit-rate-row">
      <span class="emoji">${info.emoji}</span>
      <span class="sport-name">${getGroupLocalizedName(group)}</span>
      <div class="hit-rate-bar-bg"><div class="hit-rate-bar" style="width:${avg}%;background:var(${info.accent})"></div></div>
      <span class="hit-rate-pct" style="color:var(${info.accent})">${avg}%</span>
    </div>`;
  });
  html += `</div>`;

  // Hot matches - top matches by highest implied probability
  html += `<div class="dash-card"><h3>${t('dashHot')}</h3>`;
  const allMatchProbs = [];
  Object.keys(oddsCache).forEach(sk => {
    const sInfo = sportsList.find(s => s.key === sk);
    if (!sInfo) return;
    oddsCache[sk].data.forEach(m => {
      const prob = calcImpliedProbabilities(m);
      if (prob) {
        const maxProb = Math.max(prob.homeProb, prob.awayProb);
        const fav = prob.homeProb >= prob.awayProb ? m.home_team : m.away_team;
        allMatchProbs.push({
          name: `${m.home_team} vs ${m.away_team}`,
          sport: `${getGroupInfo(sInfo.group).emoji} ${sInfo.title}`,
          prob: maxProb,
          fav,
        });
      }
    });
  });
  allMatchProbs.sort((a,b) => b.prob - a.prob);
  allMatchProbs.slice(0, 8).forEach((m, i) => {
    const rc = i===0?'r1':i===1?'r2':i===2?'r3':'';
    html += `<div class="hot-item">
      <span class="hot-rank ${rc}">${i+1}</span>
      <span style="flex:1;font-weight:500">${m.name}</span>
      <span style="color:var(--text-muted);font-size:12px">${m.sport}</span>
      <span style="color:var(--accent-current);font-weight:600;font-size:12px">${m.prob}%</span>
    </div>`;
  });
  html += `</div>`;

  // Arbitrage opportunities
  html += `<div class="dash-card"><h3>${t('dashArb')}</h3>`;
  const arbOpportunities = [];
  Object.keys(oddsCache).forEach(sk => {
    const sInfo = sportsList.find(s => s.key === sk);
    if (!sInfo) return;
    oddsCache[sk].data.forEach(m => {
      const prob = calcImpliedProbabilities(m);
      if (prob && prob.isArb) {
        arbOpportunities.push({
          name: `${m.home_team} vs ${m.away_team}`,
          sport: `${getGroupInfo(sInfo.group).emoji} ${sInfo.title}`,
          profit: prob.arbProfit,
          bestHome: prob.bestHome,
          bestAway: prob.bestAway,
          bestDraw: prob.bestDraw,
          hasDraw: prob.hasDraw,
        });
      }
    });
  });

  if (arbOpportunities.length) {
    arbOpportunities.sort((a,b) => b.profit - a.profit);
    arbOpportunities.slice(0, 8).forEach(arb => {
      html += `<div class="hot-item">
        <span class="hot-rank r1">🌟</span>
        <span style="flex:1;font-weight:500">${arb.name}</span>
        <span style="color:var(--text-muted);font-size:12px">${arb.sport}</span>
        <span style="color:#2ea043;font-weight:600;font-size:12px">+${arb.profit}% ${t('arbProfit')}</span>
      </div>`;
    });
  } else {
    html += `<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">${t('dashArbNone')}</div>`;
  }
  html += `</div>`;

  html += '</div>';
  return html;
}

// ===== WATCH LIVE MODAL =====
function openWatchModal(group) {
  const channels = LIVE_CHANNELS[group] || LIVE_CHANNELS['default'];
  const listEl = document.getElementById('channelList');
  document.getElementById('modalTitle').textContent = t('modalTitle');
  document.getElementById('modalDisclaimer').innerHTML = t('modalDisclaimer');

  listEl.innerHTML = channels.map(ch => `
    <div class="channel-item">
      <span class="channel-icon">${ch.icon}</span>
      <div class="channel-info">
        <div class="channel-name">${t(ch.nameKey)}</div>
        <div class="channel-desc">${t(ch.descKey)}</div>
      </div>
      <a class="channel-link" href="${ch.url}" target="_blank" rel="noopener noreferrer nofollow">▶</a>
    </div>
  `).join('');

  document.getElementById('watchModal').classList.add('open');
}

function closeWatchModal() {
  document.getElementById('watchModal').classList.remove('open');
}

document.getElementById('watchModal').addEventListener('click', function(e) {
  if (e.target === this) closeWatchModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeWatchModal();
});

// ===== INIT =====
async function init() {
  currentLang = detectLang();
  buildLangDropdown();
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  const langMapInit = { zh:'zh-CN', en:'en', es:'es', pt:'pt-BR', ar:'ar', ja:'ja', ko:'ko', ru:'ru', fr:'fr', de:'de' };
  document.documentElement.lang = langMapInit[currentLang] || currentLang;
  const langInfo = LANGS.find(l => l.code === currentLang);
  document.getElementById('langLabel').textContent = langInfo ? langInfo.label : '中文';

  updateDate();
  updateApiBadge();

  // Render initial loading state
  renderContent();

  try {
    await fetchSports();
    buildSidebar();
    buildMobileNav();

    // Auto-select first sport with known data
    const preferredSports = ['soccer_fifa_world_cup', 'basketball_nba', 'baseball_mlb', 'icehockey_nhl', 'soccer_epl'];
    const firstSport = preferredSports.find(sk => sportsList.some(s => s.key === sk)) ||
                       (sportsList.length ? sportsList[0].key : null);

    if (firstSport) {
      await setSport(firstSport);
    }
  } catch(e) {
    console.error('Init failed:', e);
    document.getElementById('contentArea').innerHTML = `
      <div class="error-state">
        <div class="error-icon">⚠️</div>
        <div class="error-msg">${t('loadError')}: ${e.message}</div>
        <button class="retry-btn" onclick="init()">${t('retry')}</button>
      </div>`;
  }

  applyLang();
}

init();
