<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-card: #1c2128;
  --bg-card-hover: #22272e;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --border: #30363d;
  --accent-football: #2ea043;
  --accent-basketball: #f0883e;
  --accent-esports: #a855f7;
  --accent-tennis: #a3e635;
  --accent-baseball: #3b82f6;
  --accent-football-nfl: #ef4444;
  --accent-hockey: #06b6d4;
  --accent-rugby: #10b981;
  --accent-cricket: #f59e0b;
  --accent-fighting: #dc2626;
  --accent-current: var(--accent-football);
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: var(--accent-current); text-decoration:none; }

/* Layout */
.app-layout { display:flex; flex:1; min-height:0; }

/* Sidebar */
.sidebar {
  width: 220px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
.sidebar-logo {
  padding: 20px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-logo span { font-size:22px; }
.sidebar-nav { padding: 12px 0; flex:1; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all .2s;
  font-size: 14px;
  border-left: 3px solid transparent;
}
.nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
.nav-item.active {
  background: var(--bg-card);
  color: var(--text-primary);
  border-left-color: var(--accent-current);
  font-weight: 600;
}
.nav-item .emoji { font-size:20px; width:28px; text-align:center; }
.sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
}

/* Main Content */
.main-content { flex:1; display:flex; flex-direction:column; min-width:0; }
.top-bar {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-secondary);
}
.top-bar h1 { font-size:20px; font-weight:700; }
.top-bar-right { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text-secondary); }
.page-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); background:var(--bg-secondary); }
.page-tab {
  padding: 12px 24px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  transition: all .2s;
}
.page-tab:hover { color:var(--text-primary); }
.page-tab.active { color:var(--accent-current); border-bottom-color:var(--accent-current); font-weight:600; }

.content-area { flex:1; overflow-y:auto; padding:20px 24px; }

/* Sub-filter */
.sub-filter {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.sub-filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.sub-filter-btn:hover { border-color:var(--accent-current); color:var(--text-primary); }
.sub-filter-btn.active {
  background: var(--accent-current);
  color: #fff;
  border-color: var(--accent-current);
}

/* Match Card */
.match-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
  transition: all .2s;
}
.match-card:hover { background:var(--bg-card-hover); border-color:var(--accent-current); }
.match-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--text-muted);
}
.match-league {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,255,255,.06);
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
}
.match-time { color:var(--text-secondary); }
.match-body { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.team {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:6px;
}
.team-name { font-size:15px; font-weight:600; }
.team-logo { font-size:28px; }
.predict-bar-wrap { flex:2; max-width:360px; }
.predict-bar {
  height: 28px;
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  background: var(--bg-primary);
  position: relative;
}
.predict-bar .fill {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  transition: width .6s ease;
}
.fill-home { background: var(--accent-current); border-radius:14px 0 0 14px; }
.fill-draw { background: #6e7681; }
.fill-away { background: #3b434d; border-radius:0 14px 14px 0; }
.predict-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-muted);
}
.confidence {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.confidence-label { color:var(--text-muted); }
.confidence-value { font-weight:700; }
.confidence-value.high { color:#2ea043; }
.confidence-value.medium { color:#f0883e; }
.confidence-value.low { color:#ef4444; }
.esports-meta {
  margin-top: 8px;
  display: flex;
  gap: 12px;
  font-size: 12px;
  color: var(--text-secondary);
}
.esports-meta span { display:flex; align-items:center; gap:4px; }
.map-wins { display:flex; gap:4px; margin-top:4px; }
.map-win-dot {
  width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#fff;
}
.map-win-dot.win { background:var(--accent-current); }
.map-win-dot.lose { background:#3b434d; }

/* Match card footer row */
.match-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

/* Watch Live Button */
.watch-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.04);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all .2s;
}
.watch-btn:hover {
  background: var(--accent-current);
  color: #fff;
  border-color: var(--accent-current);
}

/* Combo Section */
.combo-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
}
.combo-header {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:12px;
}
.combo-type {
  font-weight:700;
  font-size:14px;
  padding:4px 10px;
  border-radius:6px;
}
.combo-type.s2 { background:rgba(46,160,67,.15); color:var(--accent-football); }
.combo-type.s3 { background:rgba(168,85,247,.15); color:var(--accent-esports); }
.combo-type.cross { background:rgba(240,136,62,.15); color:var(--accent-basketball); }
.combo-risk { font-size:12px; }
.combo-risk.low { color:#2ea043; }
.combo-risk.medium { color:#f0883e; }
.combo-risk.high { color:#ef4444; }
.combo-picks { display:flex; flex-direction:column; gap:8px; }
.combo-pick {
  display:flex; align-items:center; gap:12px;
  padding:8px 12px;
  background:var(--bg-primary);
  border-radius:8px;
  font-size:13px;
}
.combo-pick .sport-emoji { font-size:18px; }
.combo-pick .pick-info { flex:1; }
.combo-pick .pick-team { font-weight:600; }
.combo-pick .pick-opp { color:var(--text-secondary); }
.combo-pick .pick-pct {
  font-weight:700; font-size:14px;
}
.combo-footer {
  margin-top:12px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:13px; color:var(--text-secondary);
}
.combo-total { font-weight:700; color:var(--text-primary); }

/* Dashboard */
.dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
.dash-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
}
.dash-card h3 { font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.hit-rate-row {
  display:flex; align-items:center; gap:12px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}
.hit-rate-row:last-child { border:none; }
.hit-rate-row .emoji { font-size:18px; width:24px; text-align:center; }
.hit-rate-row .sport-name { flex:1; }
.hit-rate-bar-bg {
  width:100px; height:8px; background:var(--bg-primary);
  border-radius:4px; overflow:hidden;
}
.hit-rate-bar { height:100%; border-radius:4px; transition:width .6s; }
.hit-rate-pct { font-weight:700; width:48px; text-align:right; }
.hot-item {
  display:flex; align-items:center; gap:10px;
  padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;
}
.hot-item:last-child { border:none; }
.hot-rank {
  width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:#fff;
  background:#3b434d;
}
.hot-rank.r1 { background:#f0883e; }
.hot-rank.r2 { background:#8b949e; }
.hot-rank.r3 { background:#a0522d; }
.streak-item {
  display:flex; align-items:center; gap:10px;
  padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;
}
.streak-item:last-child { border:none; }
.streak-count { font-weight:700; font-size:16px; }

/* Disclaimer */
.disclaimer {
  padding:20px 24px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--text-muted);
  text-align:center;
  line-height:1.8;
}

/* ===== Language Switcher ===== */
.lang-switcher {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.lang-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.lang-btn:hover { border-color: var(--accent-current); color: var(--text-primary); }
.lang-btn .lang-globe { font-size: 16px; }
.lang-dropdown {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 4px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
  min-width: 160px;
  z-index: 1000;
  display: none;
  overflow: hidden;
}
.lang-dropdown.open { display: block; }
.lang-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: all .15s;
}
.lang-option:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.lang-option.active { color: var(--accent-current); font-weight: 600; }
.lang-option .lang-flag { font-size: 18px; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 90%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 12px 48px rgba(0,0,0,.5);
  transform: translateY(20px);
  transition: transform .25s;
}
.modal-overlay.open .modal-box { transform: translateY(0); }
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.modal-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.modal-close:hover { background: var(--bg-primary); color: var(--text-primary); }
.modal-body { padding: 20px; }
.channel-list { display: flex; flex-direction: column; gap: 10px; }
.channel-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg-primary);
  border-radius: 8px;
  transition: all .2s;
}
.channel-item:hover { background: var(--bg-card-hover); }
.channel-icon { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
.channel-info { flex: 1; }
.channel-name { font-size: 14px; font-weight: 600; }
.channel-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.channel-link {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 6px;
  background: var(--accent-current);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  transition: opacity .2s;
  flex-shrink: 0;
}
.channel-link:hover { opacity: .85; }
.modal-disclaimer {
  margin-top: 16px;
  padding: 12px;
  background: rgba(240,136,62,.08);
  border: 1px solid rgba(240,136,62,.2);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
  line-height: 1.6;
}

/* ===== RTL Support ===== */
html[dir="rtl"] .sidebar {
  border-right: none;
  border-left: 1px solid var(--border);
}
html[dir="rtl"] .nav-item {
  border-left: none;
  border-right: 3px solid transparent;
}
html[dir="rtl"] .nav-item.active {
  border-left-color: transparent;
  border-right-color: var(--accent-current);
}
html[dir="rtl"] .fill-home { border-radius: 0 14px 14px 0; }
html[dir="rtl"] .fill-away { border-radius: 14px 0 0 14px; }
html[dir="rtl"] .lang-dropdown {
  right: auto;
  left: 0;
}
html[dir="rtl"] .predict-labels { flex-direction: row-reverse; }
html[dir="rtl"] .match-header { flex-direction: row-reverse; }
html[dir="rtl"] .combo-header { flex-direction: row-reverse; }
html[dir="rtl"] .combo-footer { flex-direction: row-reverse; }
html[dir="rtl"] .hit-rate-row { flex-direction: row-reverse; }
html[dir="rtl"] .hot-item { flex-direction: row-reverse; }
html[dir="rtl"] .streak-item { flex-direction: row-reverse; }
html[dir="rtl"] .modal-header { flex-direction: row-reverse; }
html[dir="rtl"] .channel-item { flex-direction: row-reverse; }
html[dir="rtl"] .match-card-footer { flex-direction: row-reverse; }

/* Mobile */
.mobile-nav { display:none; }
@media (max-width:768px) {
  .sidebar { display:none; }
  .mobile-nav {
    display:flex;
    overflow-x:auto;
    background:var(--bg-secondary);
    border-bottom:1px solid var(--border);
    -webkit-overflow-scrolling:touch;
  }
  .mobile-nav-item {
    flex-shrink:0;
    padding:10px 14px;
    font-size:13px;
    cursor:pointer;
    color:var(--text-secondary);
    border-bottom:2px solid transparent;
    display:flex; align-items:center; gap:4px;
  }
  .mobile-nav-item.active { color:var(--accent-current); border-bottom-color:var(--accent-current); font-weight:600; }
  .content-area { padding:14px; }
  .match-body { flex-direction:column; gap:8px; }
  .predict-bar-wrap { max-width:100%; width:100%; }
  .team { flex-direction:row; justify-content:space-between; }
  .dashboard-grid { grid-template-columns:1fr; }
  .top-bar { padding: 12px 16px; }
  .top-bar h1 { font-size: 16px; }
}
</style>
</head>

<!-- Mobile Nav -->

<div class="app-layout">

  <div class="sidebar">
    <div class="sidebar-logo"><span>🏆</span> <span data-i18n="sidebarLogo">全赛事预测</span></div>

// Current language
let currentLang = 'zh';

// Translation function with interpolation
function t(key, replacements) {
  let str = (I18N[currentLang] && I18N[currentLang][key]) || (I18N.zh[key]) || key;
  if (replacements) {
    Object.keys(replacements).forEach(k => {
      str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), replacements[k]);
    });
  }
  return str;
}

// Get sport name in current language
function tSport(sportId) {
  const keyMap = {
    football: 'sportFootball',
    basketball: 'sportBasketball',
    esports: 'sportEsports',
    tennis: 'sportTennis',
    baseball: 'sportBaseball',
    nfl: 'sportNFL',
    hockey: 'sportHockey',
    rugby: 'sportRugby',
    cricket: 'sportCricket',
    fighting: 'sportFighting',
  };
  return t(keyMap[sportId] || 'sportFootball');
}

// Detect browser language
function detectLang() {
  const stored = localStorage.getItem('sportsPredictorLang');
  if (stored && I18N[stored]) return stored;
  const browserLang = (navigator.language || navigator.userLanguage || 'zh').toLowerCase().split('-')[0];
  if (I18N[browserLang]) return browserLang;
  return 'zh';
}

// Set language
function setLang(code) {
  if (!I18N[code]) return;
  currentLang = code;
  localStorage.setItem('sportsPredictorLang', code);
  // RTL for Arabic
  document.documentElement.dir = code === 'ar' ? 'rtl' : 'ltr';
  // Update html lang attribute dynamically for SEO
  const langMap = { zh:'zh-CN', en:'en', es:'es', pt:'pt-BR', ar:'ar', ja:'ja', ko:'ko', ru:'ru', fr:'fr', de:'de' };
  document.documentElement.lang = langMap[code] || code;
  // Update page title for SEO
  const titleMap = {
    zh: '全赛事智能预测平台 - 足球篮球电竞免费预测 | SportPredict',
    en: 'Sports Predictions Today - Free Match Analysis & Tips | SportPredict',
    es: 'Predicciones Deportivas Hoy - Análisis y Consejos Gratis | SportPredict',
    pt: 'Previsões Esportivas Hoje - Análise e Dicas Grátis | SportPredict',
    ar: 'توقعات رياضية اليوم - تحليل ونصائح مجانية | SportPredict',
    ja: 'スポーツ予測今日 - 無料試合分析＆ヒント | SportPredict',
    ko: '오늘의 스포츠 예측 - 무료 경기 분석 & 팁 | SportPredict',
    ru: 'Спортивные Прогнозы Сегодня - Бесплатный Анализ | SportPredict',
    fr: 'Prédictions Sportives Aujourd\'hui - Analyse Gratuite | SportPredict',
    de: 'Sportvorhersagen Heute - Kostenlose Analyse & Tipps | SportPredict',
  };
  document.title = titleMap[code] || titleMap.en;
  applyLang();
}

// Apply language to all static elements
function applyLang() {
  // Update data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  // Update lang label
  const langInfo = LANGS.find(l => l.code === currentLang);
  document.getElementById('langLabel').textContent = langInfo ? langInfo.label : '中文';
  // Update lang dropdown active state
  document.querySelectorAll('.lang-option').forEach(el => {
    el.classList.toggle('active', el.dataset.lang === currentLang);
  });
  // Rebuild sidebar and mobile nav with translated names
  buildSidebar();
  buildMobileNav();
  // Re-set sport to update page title
  setSport(currentSport);
  // Update disclaimer
  document.getElementById('disclaimerText').innerHTML =
    t('disclaimer') + '<br>' + t('disclaimer2');
  // Update date
  updateDate();
}

function updateDate() {
  const dateEl = document.getElementById('currentDate');
  const localeMap = {
    zh: 'zh-CN', en: 'en-US', es: 'es-ES', pt: 'pt-BR',
    ar: 'ar-SA', ja: 'ja-JP', ko: 'ko-KR', ru: 'ru-RU',
    fr: 'fr-FR', de: 'de-DE',
  };
  dateEl.textContent = new Date().toLocaleDateString(localeMap[currentLang] || 'zh-CN', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
  });
}

function buildLangDropdown() {
  const dropdown = document.getElementById('langDropdown');
  dropdown.innerHTML = LANGS.map(l =>
    `<div class="lang-option${l.code === currentLang ? ' active' : ''}" data-lang="${l.code}" onclick="setLang('${l.code}');closeLangDropdown();">
      <span class="lang-flag">${l.flag}</span>
      <span>${l.label}</span>
    </div>`
  ).join('');
}

function toggleLangDropdown() {
  const dd = document.getElementById('langDropdown');
  dd.classList.toggle('open');
}

function closeLangDropdown() {
  document.getElementById('langDropdown').classList.remove('open');
}

// Close dropdown on outside click
document.addEventListener('click', function(e) {
  const sw = document.getElementById('langSwitcher');
  if (!sw.contains(e.target)) closeLangDropdown();
});

let currentSport = 'football';

let currentSubFilter = '全部';

// ===== INIT =====
function init() {
  // Initialize language
  currentLang = detectLang();
  buildLangDropdown();
  // RTL for Arabic
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  const langMapInit = { zh:'zh-CN', en:'en', es:'es', pt:'pt-BR', ar:'ar', ja:'ja', ko:'ko', ru:'ru', fr:'fr', de:'de' };
  document.documentElement.lang = langMapInit[currentLang] || currentLang;
  // Update lang label
  const langInfo = LANGS.find(l => l.code === currentLang);
  document.getElementById('langLabel').textContent = langInfo ? langInfo.label : '中文';

  updateDate();
  buildSidebar();
  buildMobileNav();
  setSport('football');

  // Apply language to static elements
  applyLang();
}

function buildSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = SPORTS.map(s =>
    `<div class="nav-item" data-sport="${s.id}" onclick="setSport('${s.id}')"><span class="emoji">${s.emoji}</span>${tSport(s.id)}</div>`
  ).join('');
}

function buildMobileNav() {
  const nav = document.getElementById('mobileNav');
  nav.innerHTML = SPORTS.map(s =>
    `<div class="mobile-nav-item" data-sport="${s.id}" onclick="setSport('${s.id}')">${s.emoji} ${tSport(s.id)}</div>`
  ).join('');
}

function setSport(id) {
  currentSport = id;
  currentSubFilter = t('all');
  const sport = SPORTS.find(s=>s.id===id);
  document.documentElement.style.setProperty('--accent-current', `var(${sport.accent})`);
  document.getElementById('pageTitle').textContent = t('pageTitle', { emoji: sport.emoji, sport: tSport(id) });
  // Update nav active
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.sport===id));
  document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.toggle('active', el.dataset.sport===id));
  renderContent();
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.page-tab').forEach(el => el.classList.toggle('active', el.dataset.page===page));
  renderContent();
}

function renderContent() {
  const area = document.getElementById('contentArea');
  if (currentPage === 'matches') area.innerHTML = renderMatches();
  else if (currentPage === 'combos') area.innerHTML = renderCombos();
  else if (currentPage === 'dashboard') area.innerHTML = renderDashboard();
}

// ===== WATCH LIVE MODAL =====
function openWatchModal(sportId) {
  const channels = LIVE_CHANNELS[sportId] || [];
  const listEl = document.getElementById('channelList');
  document.getElementById('modalTitle').textContent = t('modalTitle');
  document.getElementById('modalDisclaimer').innerHTML = t('modalDisclaimer');

  if (!channels.length) {
    listEl.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);">No channels available</div>`;
  } else {
    listEl.innerHTML = channels.map(ch => `
      <div class="channel-item">
        <span class="channel-icon">${ch.icon}</span>
        <div class="channel-info">
          <div class="channel-name">${t(ch.nameKey)}</div>
          <div class="channel-desc">${t(ch.descKey)}</div>
        </div>
        <a class="channel-link" href="${ch.url}" target="_blank" rel="noopener noreferrer nofollow">▶</a>
      </div>
    `).join('');
  }

  document.getElementById('watchModal').classList.add('open');
}

function closeWatchModal() {
  document.getElementById('watchModal').classList.remove('open');
}

// Close modal on overlay click
document.getElementById('watchModal').addEventListener('click', function(e) {
  if (e.target === this) closeWatchModal();
});

// Close modal on Escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeWatchModal();
});

// ===== MATCHES =====
function renderMatches() {
  const leagues = SUB_LEAGUES[currentSport] || ['全部'];
  const matches = MATCHES[currentSport] || [];
  const allLabel = t('all');
  const filtered = currentSubFilter === allLabel ? matches : matches.filter(m => m.league === currentSubFilter);
  const sport = SPORTS.find(s=>s.id===currentSport);
  const sportName = tSport(currentSport);

  let html = `<div class="sub-filter">${leagues.map((l, i) => {
    const label = i === 0 ? allLabel : l;
    const isActive = label === currentSubFilter || (i === 0 && currentSubFilter === allLabel);
    return `<button class="sub-filter-btn${isActive?' active':''}" onclick="filterSub('${label}')">${label}</button>`;
  }).join('')}</div>`;

  if (!filtered.length) {
    html += `<div style="text-align:center;padding:60px 0;color:var(--text-muted);font-size:15px;">${t('noMatches', {sport: sportName})}</div>`;
    return html;
  }

  filtered.forEach(m => {
    const isEsport = currentSport === 'esports';
    const isIndividual = m.isIndividual;
    const homeLabel = isIndividual ? t('player1') : t('homeTeam');
    const awayLabel = isIndividual ? t('player2') : t('awayTeam');
    const hasDraw = !currentSport.startsWith('basket') && !currentSport.startsWith('base') && !currentSport.startsWith('nfl') && !currentSport.startsWith('hockey') && !currentSport.startsWith('rugby') && !currentSport.startsWith('cricket') && !currentSport.startsWith('fight') && currentSport !== 'esports';

    const confClass = m.confidence >= 75 ? 'high' : m.confidence >= 65 ? 'medium' : 'low';

    html += `<div class="match-card">
      <div class="match-header">
        <span class="match-league">${sport.emoji} ${m.league}</span>
        <span class="match-time">🕐 ${m.time}</span>
      </div>
      <div class="match-body">
        <div class="team">
          <span class="team-logo">${m.homeEmoji}</span>
          <span class="team-name">${m.home}</span>
        </div>
        <div class="predict-bar-wrap">
          <div class="predict-bar">
            <div class="fill fill-home" style="width:${m.homeWin}%">${m.homeWin}%</div>
            ${hasDraw ? `<div class="fill fill-draw" style="width:${m.draw}%">${m.draw}%</div>` : ''}
            <div class="fill fill-away" style="width:${m.awayWin}%">${m.awayWin}%</div>
          </div>
          <div class="predict-labels">
            <span>${homeLabel}</span>
            ${hasDraw ? '<span>' + t('draw') + '</span>' : ''}
            <span>${awayLabel}</span>
          </div>
        </div>
        <div class="team">
          <span class="team-logo">${m.awayEmoji}</span>
          <span class="team-name">${m.away}</span>
        </div>
      </div>
      <div class="match-card-footer">
        <div class="confidence">
          <span class="confidence-label">${t('confidence')}</span>
          <span class="confidence-value ${confClass}">${m.confidence}%</span>
        </div>
        <button class="watch-btn" onclick="openWatchModal('${currentSport}')">${t('watchLive')}</button>
      </div>`;

    if (isEsport && m.bo) {
      html += `<div class="esports-meta">
        <span>📋 ${m.bo}</span>
        <span>${t('mapProgress')}</span>
      </div>
      <div style="display:flex;gap:16px;margin-top:4px;">
        <div style="font-size:12px;color:var(--text-secondary)">${m.home} <div class="map-wins">${m.maps[0]>0?'<div class="map-win-dot win">W</div>'.repeat(m.maps[0]):''}<div class="map-win-dot lose">L</div>${m.maps[0]<2?'<div class="map-win-dot lose">L</div>'.repeat(Math.min((parseInt(m.bo.replace('BO',''))-1)-m.maps[0],1)):''}</div></div>
        <div style="font-size:12px;color:var(--text-secondary)">${m.away} <div class="map-wins">${m.maps[1]>0?'<div class="map-win-dot win">W</div>'.repeat(m.maps[1]):''}<div class="map-win-dot lose">L</div>${m.maps[1]<2?'<div class="map-win-dot lose">L</div>'.repeat(Math.min((parseInt(m.bo.replace('BO',''))-1)-m.maps[1],1)):''}</div></div>
      </div>`;
    }

    html += `</div>`;
  });

  return html;
}

function filterSub(league) {
  currentSubFilter = league;
  renderContent();
}

// ===== COMBOS =====
function renderCombos() {
  const sport = SPORTS.find(s=>s.id===currentSport);
  const sportName = tSport(currentSport);
  const matches = MATCHES[currentSport] || [];
  let html = '';

  // Same-sport 2串1
  if (matches.length >= 2) {
    html += `<h3 style="margin-bottom:12px;font-size:16px;">${sport.emoji} ${t('combo2', {sport: sportName})}</h3>`;
    for (let i = 0; i < matches.length - 1; i += 2) {
      const m1 = matches[i], m2 = matches[i+1];
      const comboPct = Math.round(m1.confidence * m2.confidence / 100);
      const riskClass = comboPct >= 55 ? 'low' : comboPct >= 45 ? 'medium' : 'high';
      const riskLabel = comboPct >= 55 ? t('lowRisk') : comboPct >= 45 ? t('mediumRisk') : t('highRisk');
      html += `<div class="combo-card">
        <div class="combo-header">
          <span class="combo-type s2">${t('combo2Label')}</span>
          <span class="combo-risk ${riskClass}">${riskLabel} · ${t('comboWinRate')} ${comboPct}%</span>
        </div>
        <div class="combo-picks">
          <div class="combo-pick">
            <span class="sport-emoji">${sport.emoji}</span>
            <span class="pick-info"><span class="pick-team">${m1.home}</span> <span class="pick-opp">${t('vs')} ${m1.away}</span></span>
            <span class="pick-pct" style="color:var(--accent-current)">${m1.homeWin}%</span>
          </div>
          <div class="combo-pick">
            <span class="sport-emoji">${sport.emoji}</span>
            <span class="pick-info"><span class="pick-team">${m2.home}</span> <span class="pick-opp">${t('vs')} ${m2.away}</span></span>
            <span class="pick-pct" style="color:var(--accent-current)">${m2.homeWin}%</span>
          </div>
        </div>
        <div class="combo-footer">
          <span>${t('comboWinRate')}</span>
          <span class="combo-total">${comboPct}%</span>
        </div>
      </div>`;
    }
  }

  // 3串1
  if (matches.length >= 3) {
    html += `<h3 style="margin:20px 0 12px;font-size:16px;">${sport.emoji} ${t('combo3', {sport: sportName})}</h3>`;
    const m1=matches[0],m2=matches[1],m3=matches[2];
    const comboPct = Math.round(m1.confidence * m2.confidence * m3.confidence / 10000);
    const riskClass = comboPct >= 40 ? 'low' : comboPct >= 30 ? 'medium' : 'high';
    const riskLabel = comboPct >= 40 ? t('lowRisk') : comboPct >= 30 ? t('mediumRisk') : t('highRisk');
    html += `<div class="combo-card">
      <div class="combo-header">
        <span class="combo-type s3">${t('combo3Label')}</span>
        <span class="combo-risk ${riskClass}">${riskLabel} · ${t('comboWinRate')} ${comboPct}%</span>
      </div>
      <div class="combo-picks">
        <div class="combo-pick">
          <span class="sport-emoji">${sport.emoji}</span>
          <span class="pick-info"><span class="pick-team">${m1.home}</span> <span class="pick-opp">${t('vs')} ${m1.away}</span></span>
          <span class="pick-pct" style="color:var(--accent-current)">${m1.homeWin}%</span>
        </div>
        <div class="combo-pick">
          <span class="sport-emoji">${sport.emoji}</span>
          <span class="pick-info"><span class="pick-team">${m2.home}</span> <span class="pick-opp">${t('vs')} ${m2.away}</span></span>
          <span class="pick-pct" style="color:var(--accent-current)">${m2.homeWin}%</span>
        </div>
        <div class="combo-pick">
          <span class="sport-emoji">${sport.emoji}</span>
          <span class="pick-info"><span class="pick-team">${m3.home}</span> <span class="pick-opp">${t('vs')} ${m3.away}</span></span>
          <span class="pick-pct" style="color:var(--accent-current)">${m3.homeWin}%</span>
        </div>
      </div>
      <div class="combo-footer">
        <span>${t('comboWinRate')}</span>
        <span class="combo-total">${comboPct}%</span>
      </div>
    </div>`;
  }

  // Cross-sport combos
  html += `<h3 style="margin:20px 0 12px;font-size:16px;">🌍 ${t('crossCombo')}</h3>`;
  const allMatches = [];
  Object.entries(MATCHES).forEach(([sid, ms]) => {
    ms.forEach(m => allMatches.push({...m, sportId: sid}));
  });
  const crossCombos = [
    [allMatches.find(m=>m.id==='f1'), allMatches.find(m=>m.id==='b1'), allMatches.find(m=>m.id==='e1')],
    [allMatches.find(m=>m.id==='f3'), allMatches.find(m=>m.id==='b3'), allMatches.find(m=>m.id==='t1')],
    [allMatches.find(m=>m.id==='f5'), allMatches.find(m=>m.id==='bs1'), allMatches.find(m=>m.id==='fg1')],
  ];

  crossCombos.forEach(combo => {
    if (combo.some(c=>!c)) return;
    const comboPct = Math.round(combo.reduce((acc,c)=>acc*c.confidence,1) / Math.pow(100, combo.length-1));
    const riskClass = comboPct >= 40 ? 'low' : comboPct >= 30 ? 'medium' : 'high';
    const riskLabel = comboPct >= 40 ? t('lowRisk') : comboPct >= 30 ? t('mediumRisk') : t('highRisk');
    const sportEm = sid => SPORTS.find(s=>s.id===sid)?.emoji||'🏆';

    html += `<div class="combo-card">
      <div class="combo-header">
        <span class="combo-type cross">${t('crossCombo3')}</span>
        <span class="combo-risk ${riskClass}">${riskLabel} · ${t('comboWinRate')} ${comboPct}%</span>
      </div>
      <div class="combo-picks">
        ${combo.map(c => `<div class="combo-pick">
          <span class="sport-emoji">${sportEm(c.sportId)}</span>
          <span class="pick-info"><span class="pick-team">${c.home}</span> <span class="pick-opp">${t('vs')} ${c.away}</span></span>
          <span class="pick-pct" style="color:var(--accent-current)">${c.homeWin}%</span>
        </div>`).join('')}
      </div>
      <div class="combo-footer">
        <span>${t('comboWinRate')}</span>
        <span class="combo-total">${comboPct}%</span>
      </div>
    </div>`;
  });

  return html;
}

    { emoji:'🏈', sportId:'nfl', rate:63, color:'var(--accent-football-nfl)' },
    { emoji:'🏒', sportId:'hockey', rate:59, color:'var(--accent-hockey)' },
    { emoji:'🏉', sportId:'rugby', rate:57, color:'var(--accent-rugby)' },
    { emoji:'🏏', sportId:'cricket', rate:55, color:'var(--accent-cricket)' },
    { emoji:'🥊', sportId:'fighting', rate:66, color:'var(--accent-fighting)' },
  ];
  hitRates.forEach(r => {
    html += `<div class="hit-rate-row">
      <span class="emoji">${r.emoji}</span>
      <span class="sport-name">${tSport(r.sportId)}</span>
      <div class="hit-rate-bar-bg"><div class="hit-rate-bar" style="width:${r.rate}%;background:${r.color}"></div></div>
      <span class="hit-rate-pct" style="color:${r.color}">${r.rate}%</span>
    </div>`;
  });
  html += `</div>`;

  // Hot matches
  html += `<div class="dash-card"><h3>${t('dashHot')}</h3>`;
  const hotMatches = [
    { rank:1, name:'皇马 vs 巴萨', sport:'⚽ 西甲', heat:'98.2' },
    { rank:2, name:'T1 vs Gen.G', sport:'🎮 LOL', heat:'85.6' },
    { rank:3, name:'曼城 vs 阿森纳', sport:'⚽ 英超', heat:'79.3' },
    { rank:4, name:'湖人 vs 凯尔特人', sport:'🏀 NBA', heat:'72.1' },
    { rank:5, name:'德约 vs 阿尔卡拉斯', sport:'🎾 ATP', heat:'65.8' },
    { rank:6, name:'NaVi vs FaZe', sport:'🎮 CS2', heat:'58.4' },
    { rank:7, name:'洋基 vs 道奇', sport:'⚾ MLB', heat:'51.2' },
    { rank:8, name:'马哈切夫 vs 普瓦里尔', sport:'🥊 UFC', heat:'46.7' },
  ];
  hotMatches.forEach(m => {
    const rc = m.rank===1?'r1':m.rank===2?'r2':m.rank===3?'r3':'';
    html += `<div class="hot-item">
      <span class="hot-rank ${rc}">${m.rank}</span>
      <span style="flex:1;font-weight:500">${m.name}</span>
      <span style="color:var(--text-muted);font-size:12px">${m.sport}</span>
      <span style="color:var(--accent-current);font-weight:600;font-size:12px">${m.heat}${t('heatUnit')}</span>
    </div>`;
  });
  html += `</div>`;

  // Streaks
  html += `<div class="dash-card"><h3>${t('dashStreak')}</h3>`;
  const streaks = [
    { name: currentLang === 'zh' ? '足球达人' : 'Football Pro', streak:12, sport:'⚽' },
    { name: currentLang === 'zh' ? '电竞之王' : 'Esports King', streak:9, sport:'🎮' },
    { name: currentLang === 'zh' ? 'NBA分析师' : 'NBA Analyst', streak:8, sport:'🏀' },
    { name: currentLang === 'zh' ? '全能玩家' : 'All-Rounder', streak:7, sport:'🏆' },
    { name: currentLang === 'zh' ? '网球专家' : 'Tennis Expert', streak:6, sport:'🎾' },
  ];
  streaks.forEach((s,i) => {
    html += `<div class="streak-item">
      <span style="font-size:16px">${s.sport}</span>
      <span style="flex:1;font-weight:500">${s.name}</span>
      <span class="streak-count" style="color:var(--accent-current)">${s.streak}${t('streakUnit')}</span>
    </div>`;
  });
  html += `</div>`;

  html += '</div>';
  return html;
}
