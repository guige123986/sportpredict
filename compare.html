let curLang=localStorage.getItem('sp_lang')||'zh';
function t(k){return I18N[curLang]?.[k]||I18N.en[k]||k}
function applyI18N(){document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');const v=t(k);if(v)el.textContent=v})}
function toggleLang(){document.getElementById('langDD').classList.toggle('open')}
function buildLangDD(){const dd=document.getElementById('langDD');dd.innerHTML=LANGS.map(l=>`<div class="lang-opt${l.code===curLang?' active':''}" onclick="setLang('${l.code}')">${l.flag} ${l.label}</div>`).join('')}
function setLang(code){curLang=code;localStorage.setItem('sp_lang',code);document.getElementById('curLang').textContent=LANGS.find(l=>l.code===code)?.label||'涓枃';buildLangDD();applyI18N()}
document.addEventListener('click',e=>{if(!e.target.closest('.lang-switch'))document.getElementById('langDD').classList.remove('open')});
function switchTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id))}

let sportsList=[];
const cache={};

async function fetchSports(){
  try{
    const r=await fetch(`${API_BASE}/sports/?apiKey=${API_KEY}`);
    if(!r.ok)throw new Error('API error');
    sportsList=await r.json();
    const sel1=document.getElementById('sportSelect');
    const sel2=document.getElementById('lgSport');
    const groups={};
    sportsList.forEach(s=>{if(!groups[s.group])groups[s.group]=[];groups[s.group].push(s)});
    const opts=Object.entries(groups).map(([g,ss])=>`<optgroup label="${g}">${ss.map(s=>`<option value="${s.key}">${s.title}</option>`).join('')}</optgroup>`).join('');
    sel1.innerHTML=opts;sel2.innerHTML=opts;
    loadLeagues();loadLgLeagues();
  }catch(e){console.error(e)}
}

function loadLeagues(){
  const sport=document.getElementById('sportSelect').value;
  const sel=document.getElementById('leagueSelect');
  const filtered=sportsList.filter(s=>s.group===sportsList.find(x=>x.key===sport)?.group);
  sel.innerHTML=filtered.map(s=>`<option value="${s.key}">${s.title}</option>`).join('');
}
function loadLgLeagues(){
  const sport=document.getElementById('lgSport').value;
  const sel=document.getElementById('lgLeague');
  const filtered=sportsList.filter(s=>s.group===sportsList.find(x=>x.key===sport)?.group);
  sel.innerHTML=filtered.map(s=>`<option value="${s.key}">${s.title}</option>`).join('');
}

async function fetchOdds(sportKey){
  const ck='odds_'+sportKey;
  if(cache[ck]&&(Date.now()-cache[ck].ts)<5*60*1000)return cache[ck].data;
  try{
    const r=await fetch(`${API_BASE}/sports/${sportKey}/odds/?apiKey=${API_KEY}&oddsFormat=decimal`);
    if(!r.ok)throw new Error('API error');
    const data=await r.json();
    cache[ck]={data,ts:Date.now()};
    return data;
  }catch(e){return null}
}

async function loadOdds(){
  const league=document.getElementById('leagueSelect').value;
  if(!league)return;
  const div=document.getElementById('compareResult');
  div.innerHTML='<div class="loading"><div class="spinner"></div><span>'+t('loading')+'</span></div>';
  const data=await fetchOdds(league);
  if(!data||!data.length){div.innerHTML='<div class="error-state" style="padding:40px;text-align:center;color:var(--text2)">'+t('noData')+'</div>';return}
  let html='';
  data.slice(0,20).forEach(match=>{
    const home=match.home_team;const away=match.away_team;
    html+=`<div class="match-card"><div class="match-teams">${home} vs ${away}</div><div class="match-meta">${new Date(match.commence_time).toLocaleString()}</div>`;
    if(match.bookmakers&&match.bookmakers.length){
      // Find best odds
      let bestH=0,bestD=0,bestA=0;
      match.bookmakers.forEach(bm=>{
        const mk=bm.markets?.find(m=>m.key==='h2h');
        if(mk)mk.outcomes.forEach(o=>{
          if(o.name===home&&o.price>bestH)bestH=o.price;
          else if(o.name===away&&o.price>bestA)bestA=o.price;
          else if(o.name!=='home'&&o.name!=='away'&&o.price>bestD)bestD=o.price;
        });
      });
      html+=`<table class="odds-compare-table"><thead><tr><th>${t('bookmaker')}</th><th>${t('homeWin')}</th><th>${t('drawResult')}</th><th>${t('awayWin')}</th></tr></thead><tbody>`;
      match.bookmakers.slice(0,8).forEach(bm=>{
        const mk=bm.markets?.find(m=>m.key==='h2h');
        if(!mk)return;
        let hO=null,dO=null,aO=null;
        mk.outcomes.forEach(o=>{
          if(o.name===home){hO=o.price}else if(o.name===away){aO=o.price}else{dO=o.price}
        });
        html+=`<tr><td>${bm.title}</td>`;
        html+=`<td class="${hO===bestH?'best-odd':''}">${hO?hO.toFixed(2):'-'}</td>`;
        html+=`<td class="${dO===bestD?'best-odd':''}">${dO?dO.toFixed(2):'-'}</td>`;
        html+=`<td class="${aO===bestA?'best-odd':''}">${aO?aO.toFixed(2):'-'}</td>`;
        // Show diff percentage
        if(hO&&bestH){const diff=((bestH-hO)/hO*100).toFixed(1);if(diff>0)html+=`<span class="diff-pct">+${diff}%</span>`}
        html+=`</tr>`;
      });
      html+='</tbody></table>';
    }
    html+='</div>';
  });
  div.innerHTML=html;
}

async function loadLeague(){
  const league=document.getElementById('lgLeague').value;
  if(!league)return;
  const div=document.getElementById('leagueResult');
  div.innerHTML='<div class="loading"><div class="spinner"></div><span>'+t('loading')+'</span></div>';
  const data=await fetchOdds(league);
  if(!data||!data.length){div.innerHTML='<div style="padding:40px;text-align:center;color:var(--text2)">'+t('noData')+'</div>';return}
  const sport=data[0]?.sport_title||league;
  let html=`<div class="league-card"><h3>${sport} - ${data.length} ${t('matchCount')}</h3>`;
  data.forEach(match=>{
    const home=match.home_team;const away=match.away_team;
    let bestH=0,bestD=0,bestA=0;
    let hProb=0,dProb=0,aProb=0;
    if(match.bookmakers&&match.bookmakers.length){
      const bm=match.bookmakers[0];
      const mk=bm.markets?.find(m=>m.key==='h2h');
      if(mk){
        mk.outcomes.forEach(o=>{
          if(o.name===home){hProb=1/o.price*100;bestH=o.price}
          else if(o.name===away){aProb=1/o.price*100;bestA=o.price}
          else{dProb=1/o.price*100;bestD=o.price}
        });
      }
      // Find best across all bookmakers
      match.bookmakers.forEach(bm2=>{
        const mk2=bm2.markets?.find(m=>m.key==='h2h');
        if(mk2)mk2.outcomes.forEach(o=>{
          if(o.name===home&&o.price>bestH)bestH=o.price;
          else if(o.name===away&&o.price>bestA)bestA=o.price;
          else if(o.price>bestD)bestD=o.price;
        });
      });
    }
    let bias=hProb>aProb?t('homeWin'):(aProb>hProb?t('awayWin'):t('drawResult'));
    html+=`<div class="mini-odds"><span class="mini-teams">${home} vs ${away}</span>`;
    if(bestH)html+=`<span class="mini-best">${bestH.toFixed(2)}</span>`;
    html+=`<span class="mini-trend">${t('marketBias')}: ${bias}</span></div>`;
  });
  html+='</div>';
  div.innerHTML=html;
}

// Init
buildLangDD();applyI18N();
if(curLang!=='zh')document.getElementById('curLang').textContent=LANGS.find(l=>l.code===curLang)?.label||'涓枃';
fetchSports();
</script>
