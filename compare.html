<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6}
a{color:#4ade80;text-decoration:none}
.nav{background:#1a1a2e;padding:12px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #2a2a3e}
.nav-logo{font-size:20px;font-weight:900;color:#4ade80}
.nav-links{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.nav-links a{color:#888}
.container{max-width:1000px;margin:0 auto;padding:20px}
h1{font-size:28px;margin-bottom:8px;color:#fff}
.subtitle{color:#888;margin-bottom:24px}
.sport-select{padding:10px 16px;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:8px;color:#fff;font-size:15px;margin-bottom:20px;width:100%;max-width:400px}
.match-card{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:12px;padding:16px;margin-bottom:12px}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.match-teams{font-size:16px;font-weight:700;color:#fff}
.match-time{font-size:12px;color:#888}
.best-odds{display:flex;gap:8px;margin-bottom:12px}
.best-odds-item{padding:4px 10px;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);border-radius:6px;font-size:12px}
.best-odds-item span{color:#4ade80;font-weight:700}
.odds-table{width:100%;border-collapse:collapse;font-size:13px}
.odds-table th{text-align:left;padding:6px 8px;border-bottom:1px solid #2a2a3e;color:#888;font-weight:600;font-size:11px}
.odds-table td{padding:6px 8px;border-bottom:1px solid #1a1a2e}
.odds-best{color:#4ade80;font-weight:700}
.discrepancy-badge{background:rgba(239,68,68,.15);color:#ef4444;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.loading{text-align:center;padding:40px;color:#666}
.disclaimer{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:8px;padding:12px;font-size:12px;color:#666;text-align:center;margin-top:16px}
.share-bar{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.share-btn{padding:6px 14px;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:6px;color:#888;font-size:13px;cursor:pointer;transition:all .2s}
.share-btn:hover{border-color:#4ade80;color:#4ade80}
.expand-btn{background:none;border:1px solid #2a2a3e;color:#888;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;margin-top:8px}
.expand-btn:hover{border-color:#4ade80;color:#4ade80}
@media(max-width:600px){.container{padding:12px}h1{font-size:22px}.odds-table{font-size:11px}}
</style>

<body>
<div class="nav">
  <a href="/" class="nav-logo">🏆 SportPredict</a>

<div class="container">
<h1>📋 Odds Comparison</h1>
<p class="subtitle">Compare real-time odds from 20+ bookmakers. Find the best value.</p>

<select class="sport-select" id="sportSelect" onchange="loadData()">
  <option value="">Select a league...</option>
  <option value="soccer_fifa_world_cup">FIFA World Cup</option>
  <option value="americanfootball_nfl">NFL</option>
  <option value="basketball_nba">NBA</option>
  <option value="baseball_mlb">MLB</option>
  <option value="icehockey_nhl">NHL</option>
  <option value="soccer_conmebol_copa_libertadores">Copa Libertadores</option>
  <option value="boxing_boxing">Boxing</option>
  <option value="mma_mixed_martial_arts">MMA</option>
  <option value="tennis_atp_french_open">ATP French Open</option>
  <option value="soccer_japan_j_league">J-League</option>
</select>

<div id="content"><div class="loading">Select a league to compare odds</div></div>

<div class="disclaimer">⚠️ All odds are for analytical reference only. Data from The Odds API.</div>

<div class="share-bar">
  <button class="share-btn" onclick="shareTwitter()">𝕏 Twitter</button>
  <button class="share-btn" onclick="shareReddit()">Reddit</button>

</div>

<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8994443349650818" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>

<script>
const API_KEY='1560e77265ec5a6f65265a96ad7c36cb';
async function loadData(){
  const sport=document.getElementById('sportSelect').value;
  if(!sport)return;
  document.getElementById('content').innerHTML='<div class="loading">Loading odds data...</div>';
  try{
    const r=await fetch(`https://api.the-odds-api.com/v4/sports/${sport}/odds/?apiKey=${API_KEY}&regions=eu&markets=h2h`);
    if(!r.ok)throw new Error('API error');
    const data=await r.json();
    if(!data.length){document.getElementById('content').innerHTML='<div class="loading">No matches available</div>';return}
    renderMatches(data);
  }catch(e){document.getElementById('content').innerHTML='<div class="loading">Failed to load. Try again.</div>'}
}
function renderMatches(matches){
  let html='';
  matches.forEach((m,i)=>{
    if(!m.bookmakers||!m.bookmakers.length)return;
    const hasDraw=m.bookmakers[0].markets&&m.bookmakers[0].markets[0]&&m.bookmakers[0].markets[0].outcomes.some(o=>o.name==='Draw');
    let bestH=0,bestD=0,bestA=0;
    m.bookmakers.forEach(bk=>{const o=bk.markets[0].outcomes;const h=o.find(x=>x.name===m.home_team);const a=o.find(x=>x.name===m.away_team);const d=o.find(x=>x.name==='Draw');if(h&&h.price>bestH)bestH=h.price;if(d&&d.price>bestD)bestD=d.price;if(a&&a.price>bestA)bestA=a.price});
    const total=1/bestH+(hasDraw&&bestD?1/bestD:0)+1/bestA;
    const hasArb=total<1;
    html+=`<div class="match-card">
      <div class="match-header">
        <div class="match-teams">${m.home_team} vs ${m.away_team} ${hasArb?'<span class="discrepancy-badge">DISCREPANCY '+((1-total)*100).toFixed(1)+'%</span>':''}</div>
        <div class="match-time">${new Date(m.commence_time).toLocaleDateString()}</div>
      </div>
      <div class="best-odds">
        <div class="best-odds-item">Home: <span>${bestH.toFixed(2)}</span></div>
        ${hasDraw?`<div class="best-odds-item">Draw: <span>${bestD.toFixed(2)}</span></div>`:''}
        <div class="best-odds-item">Away: <span>${bestA.toFixed(2)}</span></div>
      </div>
      <table class="odds-table" id="odds-${i}" style="display:${i<3?'table':'none'}">
        <tr><th>Bookmaker</th><th>Home</th>${hasDraw?'<th>Draw</th>':''}<th>Away</th></tr>`;
    m.bookmakers.slice(0,6).forEach(bk=>{
      const o=bk.markets[0].outcomes;
      const h=o.find(x=>x.name===m.home_team);
      const a=o.find(x=>x.name===m.away_team);
      const d=o.find(x=>x.name==='Draw');
      html+=`<tr><td>${bk.title}</td>
        <td class="${h.price===bestH?'odds-best':''}">${h.price.toFixed(2)}</td>
        ${hasDraw?`<td class="${d&&d.price===bestD?'odds-best':''}">${d?d.price.toFixed(2):'-'}</td>`:''}
        <td class="${a.price===bestA?'odds-best':''}">${a.price.toFixed(2)}</td></tr>`;
    });
    html+=`</table>
      ${m.bookmakers.length>6||i>=3?`<button class="expand-btn" onclick="toggleOdds(${i},this)">${i>=3?'Show odds':'Show all bookmakers'}</button>`:''}
    </div>`;
  });
  document.getElementById('content').innerHTML=html;
}
function toggleOdds(i,btn){
  const t=document.getElementById('odds-'+i);
  if(t.style.display==='none'){t.style.display='table';btn.textContent='Hide'}
  else{t.style.display='none';btn.textContent='Show odds'}
}
function shareTwitter(){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(document.title)+'&url='+encodeURIComponent(location.href))}
function shareReddit(){window.open('https://reddit.com/submit?url='+encodeURIComponent(location.href)+'&title='+encodeURIComponent(document.title))}
function shareWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(document.title+' '+location.href))}
function copyLink(){navigator.clipboard.writeText(location.href);alert('Link copied!')}
</script>
