body{background:#0a0a1a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6}
a{color:#4ade80;text-decoration:none}

.nav-logo{font-size:20px;font-weight:900;color:#4ade80}
.nav-links{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.nav-links a{color:#888}
.container{max-width:900px;margin:0 auto;padding:20px}
h1{font-size:28px;margin-bottom:8px;color:#fff}
.subtitle{color:#888;margin-bottom:24px}
.sport-select{padding:10px 16px;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:8px;color:#fff;font-size:15px;margin-bottom:20px;width:100%;max-width:400px}
.card{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:18px;color:#fff;margin-bottom:12px}
.match-row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #2a2a3e}
.match-row:last-child{border:none}
.match-teams{flex:1;font-weight:600}
.prob-bar-container{flex:2;display:flex;gap:2px;height:24px;border-radius:4px;overflow:hidden}
.prob-segment{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;transition:width .3s}
.prob-home{background:#4ade80;color:#0a0a1a}
.prob-draw{background:#6e7681}
.prob-away{background:#ef4444}
.heatmap-table{width:100%;border-collapse:collapse;font-size:13px}
.heatmap-table th{text-align:left;padding:8px;border-bottom:1px solid #2a2a3e;color:#888;font-weight:600}
.heatmap-table td{padding:8px;border-bottom:1px solid #1a1a2e}
.heat-low{background:rgba(74,222,128,.15);color:#4ade80;font-weight:700}
.heat-mid{background:rgba(251,191,36,.15);color:#fbbf24}
.heat-high{background:rgba(239,68,68,.15);color:#ef4444;font-weight:700}
.loading{text-align:center;padding:40px;color:#666}
.disclaimer{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:8px;padding:12px;font-size:12px;color:#666;text-align:center;margin-top:16px}
.share-bar{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.share-btn{padding:6px 14px;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:6px;color:#888;font-size:13px;cursor:pointer;transition:all .2s}
.share-btn:hover{border-color:#4ade80;color:#4ade80}

</style>

<div class="container">
<h1>🔬 Probability Analyzer</h1>
<p class="subtitle">Market probability distributions, odds tracking & bookmaker heatmap comparison</p>

<select class="sport-select" id="sportSelect" onchange="loadData()">
  <option value="">Select a league...</option>
  <option value="soccer_fifa_world_cup">FIFA World Cup</option>
  <option value="americanfootball_nfl">NFL</option>
  <option value="basketball_nba">NBA</option>
  <option value="baseball_mlb">MLB</option>
  <option value="icehockey_nhl">NHL</option>
  <option value="soccer_conmebol_copa_libertadores">Copa Libertadores</option>
  <option value="boxing_boxing">Boxing</option>
  <option value="mma_mixed_martial_arts">MMA</option>
  <option value="tennis_atp_french_open">ATP French Open</option>
  <option value="soccer_japan_j_league">J-League</option>
</select>

<div id="content"><div class="loading">Select a league to analyze</div></div>

<div class="disclaimer">⚠️ All data is for analytical reference only. Odds sourced from The Odds API.</div>

<div class="share-bar">

<script>
const API_KEY='1560e77265ec5a6f65265a96ad7c36cb';
async function loadData(){
  const sport=document.getElementById('sportSelect').value;
  if(!sport)return;
  document.getElementById('content').innerHTML='<div class="loading">Loading data...</div>';
  try{
    const r=await fetch(`https://api.the-odds-api.com/v4/sports/${sport}/odds/?apiKey=${API_KEY}&regions=eu&markets=h2h`);
    if(!r.ok)throw new Error('API error');
    const data=await r.json();
    if(!data.length){document.getElementById('content').innerHTML='<div class="loading">No matches available for this league</div>';return}
    renderProbBars(data);
    renderHeatmap(data);
  }catch(e){document.getElementById('content').innerHTML='<div class="loading">Failed to load data. Please try again.</div>'}
}
function renderProbBars(matches){
  let html='<div class="card"><h2>📊 Market Probability Distribution</h2>';
  matches.slice(0,20).forEach(m=>{
    const bk=m.bookmakers&&m.bookmakers[0];
    if(!bk||!bk.markets||!bk.markets[0])return;
    const outcomes=bk.markets[0].outcomes;
    if(outcomes.length<2)return;
    const homeO=outcomes.find(o=>o.name===m.home_team);
    const awayO=outcomes.find(o=>o.name===m.away_team);
    const drawO=outcomes.find(o=>o.name==='Draw');
    if(!homeO||!awayO)return;
    const hp=1/homeO.price*100, ap=1/awayO.price*100;
    const dp=drawO?1/drawO.price*100:0;
    const total=hp+dp+ap;
    const hPct=(hp/total*100).toFixed(1), dPct=(dp/total*100).toFixed(1), aPct=(ap/total*100).toFixed(1);
    html+=`<div class="match-row">
      <div class="match-teams">${m.home_team} vs ${m.away_team}</div>
      <div class="prob-bar-container">
        <div class="prob-segment prob-home" style="width:${hPct}%">${hPct}%</div>
        ${drawO?`<div class="prob-segment prob-draw" style="width:${dPct}%">${dPct}%</div>`:''}
        <div class="prob-segment prob-away" style="width:${aPct}%">${aPct}%</div>
      </div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('content').innerHTML=html;
}
function renderHeatmap(matches){
  const m=matches[0];if(!m||!m.bookmakers||m.bookmakers.length<2)return;
  const bks=m.bookmakers.slice(0,8);
  const outcomes=bks[0].markets&&bks[0].markets[0]&&bks[0].markets[0].outcomes;
  if(!outcomes)return;
  const hasDraw=outcomes.some(o=>o.name==='Draw');
  let html='<div class="card"><h2>🔥 Odds Heatmap - '+m.home_team+' vs '+m.away_team+'</h2>';
  html+='<table class="heatmap-table"><tr><th>Bookmaker</th><th>Home</th>';
  if(hasDraw)html+='<th>Draw</th>';
  html+='<th>Away</th></tr>';
  let bestH=0,bestD=0,bestA=0;
  bks.forEach(bk=>{const o=bk.markets[0].outcomes;const h=o.find(x=>x.name===m.home_team);const a=o.find(x=>x.name===m.away_team);const d=o.find(x=>x.name==='Draw');if(h&&h.price>bestH)bestH=h.price;if(d&&d.price>bestD)bestD=d.price;if(a&&a.price>bestA)bestA=a.price});
  bks.forEach(bk=>{
    const o=bk.markets[0].outcomes;
    const h=o.find(x=>x.name===m.home_team);
    const a=o.find(x=>x.name===m.away_team);
    const d=o.find(x=>x.name==='Draw');
    html+=`<tr><td>${bk.title}</td>`;
    html+=`<td class="${h.price===bestH?'heat-low':'heat-mid'}">${h.price.toFixed(2)}</td>`;
    if(hasDraw)html+=`<td class="${d&&d.price===bestD?'heat-low':'heat-mid'}">${d?d.price.toFixed(2):'-'}</td>`;
    html+=`<td class="${a.price===bestA?'heat-low':'heat-mid'}">${a.price.toFixed(2)}</td></tr>`;
  });
  html+='</table></div>';
  document.getElementById('content').innerHTML+=html;
}
function shareTwitter(){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(document.title)+'&url='+encodeURIComponent(location.href))}
function shareReddit(){window.open('https://reddit.com/submit?url='+encodeURIComponent(location.href)+'&title='+encodeURIComponent(document.title))}
function shareWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(document.title+' '+location.href))}
function copyLink(){navigator.clipboard.writeText(location.href);alert('Link copied!')}
</script>
