let curLang=localStorage.getItem('sp_lang')||'zh';
function t(k){return I18N[curLang]?.[k]||I18N.en[k]||k}
function applyI18N(){document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');const v=t(k);if(v)el.textContent=v})}
function toggleLang(){document.getElementById('langDD').classList.toggle('open')}
function buildLangDD(){const dd=document.getElementById('langDD');dd.innerHTML=LANGS.map(l=>`<div class="lang-opt${l.code===curLang?' active':''}" onclick="setLang('${l.code}')">${l.flag} ${l.label}</div>`).join('')}
function setLang(code){curLang=code;localStorage.setItem('sp_lang',code);document.getElementById('curLang').textContent=LANGS.find(l=>l.code===code)?.label||'涓枃';buildLangDD();applyI18N()}
document.addEventListener('click',e=>{if(!e.target.closest('.lang-switch'))document.getElementById('langDD').classList.remove('open')});
function switchTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id))}

let sportsList=[];
const cache={};

async function fetchSports(){
  try{
    const r=await fetch(`${API_BASE}/sports/?apiKey=${API_KEY}`);
    if(!r.ok)throw new Error('API error');
    sportsList=await r.json();
    const sel1=document.getElementById('sportSelect');
    const sel2=document.getElementById('hmSport');
    const groups={};
    sportsList.forEach(s=>{if(!groups[s.group])groups[s.group]=[];groups[s.group].push(s)});
    const opts=Object.entries(groups).map(([g,ss])=>`<optgroup label="${g}">${ss.map(s=>`<option value="${s.key}">${s.title}</option>`).join('')}</optgroup>`).join('');
    sel1.innerHTML=opts;sel2.innerHTML=opts;
    loadLeagues();loadHmLeagues();
  }catch(e){console.error(e)}
}

function loadLeagues(){
  const sport=document.getElementById('sportSelect').value;
  const sel=document.getElementById('leagueSelect');
  const filtered=sportsList.filter(s=>s.group===sportsList.find(x=>x.key===sport)?.group);
  sel.innerHTML=filtered.map(s=>`<option value="${s.key}">${s.title}</option>`).join('');
}
function loadHmLeagues(){
  const sport=document.getElementById('hmSport').value;
  const sel=document.getElementById('hmLeague');
  const filtered=sportsList.filter(s=>s.group===sportsList.find(x=>x.key===sport)?.group);
  sel.innerHTML=filtered.map(s=>`<option value="${s.key}">${s.title}</option>`).join('');
}

async function fetchOdds(sportKey){
  const ck='odds_'+sportKey;
  if(cache[ck]&&(Date.now()-cache[ck].ts)<5*60*1000)return cache[ck].data;
  try{
    const r=await fetch(`${API_BASE}/sports/${sportKey}/odds/?apiKey=${API_KEY}&oddsFormat=decimal`);
    if(!r.ok)throw new Error('API error');
    const data=await r.json();
    cache[ck]={data,ts:Date.now()};
    return data;
  }catch(e){return null}
}

async function analyzeMarket(){
  const league=document.getElementById('leagueSelect').value;
  if(!league)return;
  const div=document.getElementById('marketResult');
  div.innerHTML='<div class="loading"><div class="spinner"></div><span>'+t('loading')+'</span></div>';
  const data=await fetchOdds(league);
  if(!data||!data.length){div.innerHTML='<div class="error-state">'+t('noData')+'</div>';return}
  let html='';
  data.forEach(match=>{
    const home=match.home_team;const away=match.away_team;
    let hOdds=null,dOdds=null,aOdds=null;
    if(match.bookmakers&&match.bookmakers.length){
      const bm=match.bookmakers[0];
      const mk=bm.markets?.find(m=>m.key==='h2h');
      if(mk){
        mk.outcomes.forEach(o=>{
          if(o.name===home)hOdds=o.price;
          else if(o.name===away)aOdds=o.price;
          else dOdds=o.price;
        });
      }
    }
    html+=`<div class="match-card"><div class="match-header"><span>${match.sport_title||''}</span><span>${new Date(match.commence_time).toLocaleString()}</span></div><div class="match-teams">${home} vs ${away}</div>`;
    if(hOdds&&aOdds){
      const hp=1/hOdds*100,dp=dOdds?1/dOdds*100:0,ap=1/aOdds*100;
      const total=hp+dp+ap;
      html+=`<div class="prob-row"><span class="prob-team">${t('homeWin')}</span><div class="prob-bar-wrap"><div class="prob-bar-fill home-fill" style="width:${hp/total*100}%">${hp.toFixed(1)}%</div></div><span class="prob-pct">${hp.toFixed(1)}%</span></div>`;
      if(dOdds)html+=`<div class="prob-row"><span class="prob-team">${t('drawResult')}</span><div class="prob-bar-wrap"><div class="prob-bar-fill draw-fill" style="width:${dp/total*100}%">${dp.toFixed(1)}%</div></div><span class="prob-pct">${dp.toFixed(1)}%</span></div>`;
      html+=`<div class="prob-row"><span class="prob-team">${t('awayWin')}</span><div class="prob-bar-wrap"><div class="prob-bar-fill away-fill" style="width:${ap/total*100}%">${ap.toFixed(1)}%</div></div><span class="prob-pct">${ap.toFixed(1)}%</span></div>`;
    }
    html+='</div>';
  });
  div.innerHTML=html;
}

async function loadMatches(){
  const league=document.getElementById('leagueSelect').value;
  if(!league)return;
  const data=await fetchOdds(league);
  const sel=document.getElementById('historyMatch');
  if(!data||!data.length){sel.innerHTML='<option>'+t('noData')+'</option>';return}
  sel.innerHTML=data.map((m,i)=>`<option value="${i}">${m.home_team} vs ${m.away_team}</option>`).join('');
  // Store for history tracking
  window._matchesData=data;
}

async function trackHistory(){
  const league=document.getElementById('leagueSelect').value;
  const idx=document.getElementById('historyMatch').value;
  const div=document.getElementById('historyResult');
  div.innerHTML='<div class="loading"><div class="spinner"></div><span>'+t('loading')+'</span></div>';
  const data=await fetchOdds(league);
  if(!data||!data[idx]){div.innerHTML='<div class="error-state">'+t('noData')+'</div>';return}
  const match=data[idx];
  // Save snapshot to localStorage
  const key='sp_history_'+match.id;
  let history=JSON.parse(localStorage.getItem(key)||'[]');
  const now=Date.now();
  const snapshot={ts:now,bookmakers:[]};
  if(match.bookmakers){
    match.bookmakers.forEach(bm=>{
      const mk=bm.markets?.find(m=>m.key==='h2h');
      if(mk){
        const entry={name:bm.title,odds:{}};
        mk.outcomes.forEach(o=>{entry.odds[o.name]=o.price});
        snapshot.bookmakers.push(entry);
      }
    });
  }
  history.push(snapshot);
  if(history.length>100)history=history.slice(-100);
  localStorage.setItem(key,JSON.stringify(history));
  // Draw trend chart with canvas
  div.innerHTML='<div class="calc-section"><h2>馃搱 '+match.home_team+' vs '+match.away_team+'</h2><canvas id="trendCanvas" height="300"></canvas></div>';
  const canvas=document.getElementById('trendCanvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width=canvas.offsetWidth;const H=canvas.height=300;
  ctx.fillStyle='var(--bg)';ctx.fillRect(0,0,W,H);
  if(history.length<2){
    ctx.fillStyle='#999';ctx.font='14px sans-serif';ctx.fillText(t('noData')+' - '+t('last24h'),20,150);
    return;
  }
  // Simple trend line for first bookmaker home odds
  const homeOdds=history.filter(h=>h.bookmakers.length>0).map(h=>h.bookmakers[0]?.odds[match.home_team]).filter(Boolean);
  const awayOdds=history.filter(h=>h.bookmakers.length>0).map(h=>h.bookmakers[0]?.odds[match.away_team]).filter(Boolean);
  if(homeOdds.length<2){ctx.fillStyle='#999';ctx.font='14px sans-serif';ctx.fillText(t('noData'),20,150);return}
  const allVals=[...homeOdds,...awayOdds];
  const minV=Math.min(...allVals)-0.2;const maxV=Math.max(...allVals)+0.2;
  const padL=50,padR=20,padT=30,padB=40;
  const gW=W-padL-padR;const gH=H-padT-padB;
  // Grid
  ctx.strokeStyle='#2a2a5a';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=padT+gH*i/4;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    ctx.fillStyle='#9999bb';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText((maxV-(maxV-minV)*i/4).toFixed(2),padL-8,y+4);
  }
  // Lines
  function drawLine(arr,color){
    if(arr.length<2)return;
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
    arr.forEach((v,i)=>{
      const x=padL+i/(arr.length-1)*gW;
      const y=padT+(maxV-v)/(maxV-minV)*gH;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  drawLine(homeOdds,'#4ade80');
  drawLine(awayOdds,'#ef4444');
  // Legend
  ctx.fillStyle='#4ade80';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText(match.home_team,padL+10,H-10);
  ctx.fillStyle='#ef4444';ctx.fillText(match.away_team,padL+120,H-10);
}

async function loadHeatmap(){
  const league=document.getElementById('hmLeague').value;
  if(!league)return;
  const div=document.getElementById('heatmapResult');
  div.innerHTML='<div class="loading"><div class="spinner"></div><span>'+t('loading')+'</span></div>';
  const data=await fetchOdds(league);
  if(!data||!data.length){div.innerHTML='<div class="error-state">'+t('noData')+'</div>';return}
  // Collect bookmakers
  const bks=new Set();
  data.slice(0,10).forEach(m=>(m.bookmakers||[]).forEach(b=>bks.add(b.title)));
  const bkList=[...bks].slice(0,8);
  let html='<table class="heatmap-table"><thead><tr><th>'+t('selectMatch')+'</th>';
  bkList.forEach(b=>html+='<th>'+b+'</th>');
  html+='</tr></thead><tbody>';
  data.slice(0,15).forEach(match=>{
    html+='<tr><td style="text-align:left;white-space:nowrap">'+match.home_team+' vs '+match.away_team+'</td>';
    bkList.forEach(bk=>{
      const bm=match.bookmakers?.find(b=>b.title===bk);
      const mk=bm?.markets?.find(m=>m.key==='h2h');
      let bestO=Infinity;
      // Find best odds for home team across all bookmakers
      match.bookmakers?.forEach(b=>{
        const m2=b.markets?.find(m=>m.key==='h2h');
        m2?.outcomes?.forEach(o=>{if(o.name===match.home_team&&o.price<bestO)bestO=o.price});
      });
      if(mk){
        const homeO=mk.outcomes.find(o=>o.name===match.home_team);
        if(homeO){
          const o=homeO.price;
          const isBest=o===bestO;
          // Color: green for high odds, red for low
          const norm=Math.min(1,Math.max(0,(o-1)/3));
          const r=Math.round(255*(1-norm)*0.3);const g=Math.round(255*norm*0.8);const b=Math.round(60);
          const bg=`rgba(${r},${g},${b},0.15)`;
          html+=`<td style="background:${bg}" class="${isBest?'best-cell':''}">${o.toFixed(2)}</td>`;
        }else html+='<td>-</td>';
      }else html+='<td>-</td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  div.innerHTML=html;
}

// Init
buildLangDD();applyI18N();
if(curLang!=='zh')document.getElementById('curLang').textContent=LANGS.find(l=>l.code===curLang)?.label||'涓枃';
fetchSports();loadMatches();
</script>
